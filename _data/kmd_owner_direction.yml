current_run: "2026-09-05 Weekly #4"

owners:
  - id: memory
    tab_zh: Memory
    tab_en: Memory
    name: GPU Memory / Virtual Memory / Unified Memory
    summary_zh: 负责从 GPUVM、Linux MM 集成到 unified/heterogeneous memory 的完整内存架构，是 KMD Leader 的纵深主线。
    summary_en: Own the full memory architecture from GPUVM and Linux MM integration to unified/heterogeneous memory; the KMD leader depth line.
    entry_zh: Recoverable fault + HMM + migration + replay；第一版建立 measurement / invalidation / teardown / reset-generation correctness，并为未来 remote mapping/invalidation 解耦数据模型。
    entry_en: Recoverable fault + HMM + migration + replay; establish measurement/invalidation/teardown/reset-generation correctness first while keeping the model evolvable for future remote mapping/invalidation.
    topics:
      - GPUVM / Page Tables / VMID / PASID / TLB
      - Recoverable GPU Page Fault / Fault Replay
      - mmu_notifier / HMM / SVM / Device-private Memory
      - CPU↔GPU Migration / Oversubscription / Eviction
      - NUMA / Large & Compound Pages / Migration Granularity
      - IOMMU / ATS / PRI / PASID / SVA
      - dma-buf / P2P Memory
      - Multi-GPU Unified Memory
    updates:
      - title_zh: 本期无新的 GPU SVM/HMM common-layer 方向变化；Tyr Rust GPU driver 开始加入真实 VM/BO uAPI
        title_en: No new GPU-SVM/HMM direction change; Tyr is adding real VM/BO uAPI support in Rust
        url: https://lwn.net/Articles/1091992/
        impact_zh: Tyr 说明 Rust DRM 正从基础框架进入 per-file VM/BO 管理，但这属于底座/公共机制；当前 Memory P0 仍是 recoverable fault/HMM/migration correctness，而不是切换到新的 VM/BO 项目。
        impact_en: Tyr shows Rust DRM moving into per-file VM/BO management, but this is foundational/common infrastructure; current Memory P0 remains recoverable-fault/HMM/migration correctness.
        priority_zh: 当前 feature 不变；Future Topic 跟踪
        priority_en: Keep the current feature; track as a Future Topic

  - id: virt
    tab_zh: 虚拟化 / 安全
    tab_en: Virt / Security
    name: GPU Virtualization / Security
    summary_zh: 负责 GPU 虚拟化、资源/租户隔离以及安全机制。
    summary_en: Own GPU virtualization, resource/tenant isolation and security mechanisms.
    entry_zh: ASIC 支持 SR-IOV 时做 PF/VF provisioning/isolation + versioned admin control + recovery semantics；否则先 capability assessment / VFIO ownership-reset assessment。
    entry_en: When SR-IOV exists, implement PF/VF provisioning/isolation, versioned admin control and recovery semantics; otherwise start with capability/VFIO ownership-reset assessment.
    topics:
      - VFIO Passthrough / Ownership / IOMMU Isolation
      - SR-IOV PF/VF Lifecycle
      - GPU Resource Partition / VMID / Queue / Doorbell / Memory
      - PF↔VF ABI / VF FLR / Reset / Accounting
      - vGPU / Live Migration Groundwork
      - Secure Boot / Measurement / Scrub / Attestation
    updates:
      - title_zh: VFIO PCI error-recovery RFC 把 assigned-device 恢复从单一 eventfd 推进到 recovery state + sequence + access guards
        title_en: VFIO PCI error-recovery RFC moves assigned-device recovery from a single eventfd to recovery state + sequence + access guards
        url: https://lwn.net/Articles/1091953/
        impact_zh: VMM 需要知道 host recovery 是否进行中、是否发生 reset、设备是否永久失败；BAR/config/IRQ/runtime PM/DMA-BUF 等访问必须统一 guard/revoke。未来 GPU VFIO/vGPU/SR-IOV recovery 应与 RAS generation 对齐，而不是另建 bool 状态。
        impact_en: VMMs need explicit host-recovery state/reset/failure semantics; BAR/config/IRQ/runtime-PM/DMA-BUF paths must be guarded/revoked. Future GPU VFIO/vGPU/SR-IOV recovery should align with RAS generations rather than separate booleans.
        priority_zh: VFIO architecture reference 现在；产品实现按需求
        priority_en: Architecture reference now; product implementation when needed

  - id: power
    tab_zh: 功耗 / 性能
    tab_en: Power / Perf
    name: GPU Power / Performance
    summary_zh: 负责 GPU measurement、DVFS、runtime PM、thermal 与 power budget。
    summary_en: Own GPU measurement, DVFS, runtime PM, thermal and power budget.
    entry_zh: busy/idle + reusable utilization telemetry + async-access quiesce correctness → runtime PM / DVFS。
    entry_en: busy/idle + reusable utilization telemetry + async-access quiesce correctness → runtime PM / DVFS.
    topics:
      - Busy/Idle / Per-engine Utilization
      - Runtime PM / Suspend-Resume / PCI D-states
      - Clock / Power Gating / Idle Residency
      - DVFS / OPP / Firmware PM Protocol
      - Thermal Throttling / Power Cap
      - Frequency Residency / Memory-bandwidth Telemetry
    updates:
      - title_zh: Crescent Island PMT v4 再次证明 telemetry/crashlog/FW callback 都是 runtime-PM active users
        title_en: Crescent Island PMT v4 shows telemetry/crashlog/FW callbacks are runtime-PM active users
        url: https://lwn.net/Articles/1092225/
        impact_zh: telemetry 只在 device powered 时可用，crashlog/共享 MMIO window 访问需要 PM/FW readiness 与 locking；第一版 runtime PM 的 quiesce matrix 必须包含 telemetry/hwmon/crashlog，而不是只覆盖 job/ioctl。
        impact_en: Telemetry is only available while powered and shared-window/crashlog access requires PM/FW readiness and locking; the first runtime-PM quiesce matrix must cover telemetry/hwmon/crashlog, not only jobs/ioctls.
        priority_zh: runtime PM 第一版纳入；复杂 governor 后置
        priority_en: Include in first runtime-PM implementation; complex governor later

  - id: ras
    tab_zh: 可靠性 / RAS
    tab_en: Reliability / RAS
    name: GPU Reliability / Recovery / RAS
    summary_zh: 负责故障 detect → diagnose → contain → recover，并形成生产级 RAS。
    summary_en: Own fault detect → diagnose → contain → recover, ultimately forming production-grade RAS.
    entry_zh: Frozen snapshot + devcoredump + FW logs + Recovery Admission/State/Sequence Contract + health contract。
    entry_en: Frozen snapshot + devcoredump + FW logs + Recovery Admission/State/Sequence Contract + health contract.
    topics:
      - Heartbeat / Watchdog / Hang Detection
      - Hang Snapshot / devcoredump / Reset Reason
      - Job Abort / Queue Kill / Context Kill / Engine Reset
      - Post-reset Restore / Replay
      - Firmware Crash Recovery / FW Log Retention
      - ECC / Bad-page Retirement / PCIe AER / Fault Injection
    updates:
      - title_zh: VFIO PCI recovery RFC 把 reset gate 深化成可复用 recovery admission/state/sequence 模型
        title_en: VFIO PCI recovery RFC deepens the reset gate into a reusable recovery admission/state/sequence model
        url: https://lwn.net/Articles/1091953/
        impact_zh: error_detected 阶段先关闭 access、revoke/guard BAR/DMA-BUF/IRQ 等路径并 drain，reset 不跨 recovery-state lock，完成后再 publish/唤醒；这个模式可直接推广到 GPU device/FW/engine/fabric recovery。
        impact_en: Close/revoke/guard access and drain before reset, avoid holding the recovery-state lock across the reset, then publish completion/wake clients; the model generalizes to GPU device/FW/engine/fabric recovery.
        priority_zh: 当前 RAS 第一阶段设计
        priority_en: Current first-stage RAS design

  - id: multi
    tab_zh: Multi-GPU
    tab_en: Multi-GPU
    name: Multi-GPU / P2P / Fabric
    summary_zh: 负责 multi-device model、topology/connectivity、P2P 与 fabric；page residency/migration policy 归 Memory。
    summary_en: Own the multi-device model, topology/connectivity, P2P and fabric; page residency/migration policy belongs to Memory.
    entry_zh: Enumeration + stable identity + topology/port/peer model + visibility/affinity + directional P2P capability matrix。
    entry_en: Enumeration + stable identity + topology/port/peer model + visibility/affinity + directional P2P capability matrix.
    topics:
      - Multi-GPU Enumeration / Stable Identity
      - Device Visibility / Affinity / Namespace / Cgroup
      - PCIe / NUMA / Switch Topology
      - P2P Capability / Peer BAR / Peer PTE
      - P2P DMA / Cross-GPU dma-buf
      - Shared VA / Multi-GPU VM / Fabric Health
    updates:
      - title_zh: 本期无新的 production-level fabric 机制超过 DRM Fabric + AMD UALink；保持 topology/control-first
        title_en: No new production-level fabric mechanism exceeds DRM Fabric + AMD UALink this week; keep topology/control-first
        url: https://lkml.iu.edu/2608.3/00335.html
        impact_zh: 继续 endpoint/port/peer、directional capability、link state/reason code；VFIO recovery 对 BAR/DMA-BUF revoke 的做法仅提醒 future peer mapping 也必须与 device/fabric recovery generation 联动。
        impact_en: Continue endpoint/port/peer, directional capabilities and link-state/reason codes; VFIO BAR/DMA-BUF revocation is only a reminder that future peer mappings must follow device/fabric recovery generations.
        priority_zh: topology/control model 现在；data path 后续
        priority_en: Topology/control now; data path later

  - id: obs
    tab_zh: 可观测性 / Profiling
    tab_en: Observability / Profiling
    name: GPU Observability / Profiling / Programmable Driver Infrastructure
    summary_zh: 负责 software trace + hardware PMU + 跨层 timeline/attribution + programmable diagnostics。
    summary_en: Own software trace + hardware PMU + cross-layer timeline/attribution + programmable diagnostics.
    entry_zh: Stable event/object identity + eBPF KMD tracing + low-overhead software/pipeline counters + unified telemetry service；HW PMU 成熟后加入同一 timeline。
    entry_en: Stable event/object identity + eBPF KMD tracing + low-overhead software/pipeline counters + unified telemetry service; join HW PMU into the same timeline when mature.
    topics:
      - Stable KMD Tracepoint / Event Model
      - BTF / CO-RE / eBPF Dynamic Tracing
      - PID / PASID / VM / Context / Queue / Job Correlation
      - UMD→KMD→FW→GPU Unified Timeline
      - GPU PMU / Counter Discovery / Sampling / Multiplexing
      - perf_event / Dynamic Diagnostics / Programmable Hooks
    updates:
      - title_zh: Crescent Island PMT v4 展示真实 GPU telemetry service 的 access ownership / PM / FW readiness / VF 边界
        title_en: Crescent Island PMT v4 exposes real GPU telemetry-service access ownership / PM / FW readiness / VF boundaries
        url: https://lwn.net/Articles/1092225/
        impact_zh: 不要让 debugfs/hwmon/profiler/RAS 各自直接控制共享 MMIO/index window；建立统一 Telemetry Service，集中 PM lifetime、FW readiness、权限/VF filtering、访问串行化和 snapshot/cache policy。
        impact_en: Do not let debugfs/hwmon/profiler/RAS independently control shared MMIO/index windows; centralize PM lifetime, FW readiness, VF/privilege filtering, serialization and snapshot/cache policy in a Telemetry Service.
        priority_zh: software telemetry service 现在；HW PMU 随硬件成熟
        priority_en: Software telemetry service now; HW PMU as hardware matures

  - id: fw
    tab_zh: Firmware / Control Plane
    tab_en: Firmware / Control Plane
    name: GPU Firmware / Control Plane Architecture
    summary_zh: 负责 KMD↔GPU system firmware 的 protocol、lifecycle、capability、resource ownership 与 state reconciliation。
    summary_en: Own KMD↔GPU system-firmware protocol, lifecycle, capability, resource ownership and state reconciliation.
    entry_zh: Versioned async protocol + capability/property + boot/reset generation + raw-ABI translation/validation + service readiness + restart state reconciliation。
    entry_en: Versioned async protocol + capability/property + boot/reset generation + raw-ABI translation/validation + service readiness + restart state reconciliation.
    topics:
      - Versioned Firmware ABI / Command & Event Namespace
      - Shared-memory / Ring / Mailbox Transport
      - Sequence ID / Async Completion / Timeout / Error
      - Capability Negotiation / Forward-Backward Compatibility
      - Boot / Restart / Upgrade / Rollback Lifecycle
      - Resource Ownership / State Reconciliation
      - FW-centric Init / PM / Reset / HW Scheduler Services
      - FW Health / Logs / Authentication / Measurement
    updates:
      - title_zh: Xe PMT late binding 证明 firmware-backed service readiness 应独立建模而不是一个全局 fw_ready bit
        title_en: Xe PMT late binding shows firmware-backed service readiness should be modeled separately from one global fw_ready bit
        url: https://lwn.net/Articles/1092225/
        impact_zh: 将 FW generation 内部拆成 CORE/MEMORY/PM/TELEMETRY/SCHED 等 service readiness；reset/restart generation 变化后旧 readiness 自动失效，上层重新等待/negotiation。
        impact_en: Model CORE/MEMORY/PM/TELEMETRY/SCHED service readiness within an FW generation; reset/restart invalidates old readiness and upper layers re-wait/re-negotiate.
        priority_zh: 当前 protocol/lifecycle 第一版加入
        priority_en: Add to the first protocol/lifecycle design

