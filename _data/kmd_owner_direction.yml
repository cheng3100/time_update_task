current_run: "2026-08-15 Weekly #1"

owners:
  - id: memory
    tab_zh: Memory
    tab_en: Memory
    name: GPU Memory / Virtual Memory / Unified Memory
    summary_zh: 负责从 GPUVM、Linux MM 集成到 unified/heterogeneous memory 的完整内存架构，是 KMD Leader 的纵深主线。
    summary_en: Own the full memory architecture from GPUVM and Linux MM integration to unified/heterogeneous memory; the KMD leader depth line.
    entry_zh: Recoverable fault + HMM + migration + replay；第一版同时建立 fault/migration measurement contract 与 MMU invalidation / teardown / reset generation correctness，第二阶段进入 migration granularity。
    entry_en: Recoverable fault + HMM + migration + replay; establish the fault/migration measurement contract and MMU-invalidation/teardown/reset-generation correctness in the first implementation, then move into migration granularity.
    topics:
      - GPUVM / Page Tables / VMID / PASID / TLB
      - Recoverable GPU Page Fault / Fault Replay
      - mmu_notifier / HMM / SVM / Device-private Memory
      - CPU↔GPU Migration / Oversubscription / Eviction
      - NUMA / Large & Compound Pages / Migration Granularity
      - IOMMU / ATS / PRI / PASID / SVA
      - dma-buf / P2P Memory
      - Multi-GPU Unified Memory
    updates:
      - title_zh: Xe GT Statistics 把 SVM fault/migration 按 4K/64K/2M 拆成可量化指标
        title_en: Xe GT Statistics decomposes SVM fault/migration metrics by 4K/64K/2M granularity
        url: https://docs.kernel.org/next/gpu/xe/xe_gt_stats.html
        impact_zh: 第一版 fault correctness 就应建立 get-pages、copy、bind、TLB、migration count/time/bytes 等 measurement contract，后续用数据选择 batched-4K/64K/2M，而不是先拍脑袋选大页。
        impact_en: The first fault-correctness implementation should establish measurement for get-pages, copy, bind, TLB and migration count/time/bytes so later granularity choices are data-driven.
        priority_zh: Measurement schema 现在；64K/2M prototype 6–12 个月
        priority_en: Measurement schema now; 64K/2M prototype in 6–12 months
      - title_zh: GPU SVM / drm_pagemap 主线未变，继续保留 N:1 与 per-device residency/mapping 可演进性
        title_en: GPU SVM / drm_pagemap direction remains stable with N:1 and per-device residency/mapping evolvability
        url: https://docs.kernel.org/next/gpu/rfc/gpusvm.html
        impact_zh: logical CPU range identity、device residency、DMA mapping、GPU PTE state 继续保持解耦。
        impact_en: Keep logical CPU-range identity, device residency, DMA mapping and GPU-PTE state decoupled.
        priority_zh: 架构兼容现在
        priority_en: Design compatibility now

  - id: virt
    tab_zh: 虚拟化 / 安全
    tab_en: Virt / Security
    name: GPU Virtualization / Security
    summary_zh: 负责 GPU 虚拟化、资源/租户隔离以及安全机制。
    summary_en: Own GPU virtualization, resource/tenant isolation and security mechanisms.
    entry_zh: ASIC 支持 SR-IOV 时做 PF/VF provisioning/isolation；否则先 capability assessment。
    entry_en: When SR-IOV exists on the ASIC, do PF/VF provisioning/isolation; otherwise start with capability assessment.
    topics:
      - VFIO Passthrough / Ownership / IOMMU Isolation
      - SR-IOV PF/VF Lifecycle
      - GPU Resource Partition / VMID / Queue / Doorbell / Memory
      - PF↔VF ABI / VF FLR / Reset / Accounting
      - vGPU / Live Migration Groundwork
      - Secure Boot / Measurement / Scrub / Attestation
    updates:
      - title_zh: 本期无高价值方向级新增；Xe configfs 仍是 GPU SR-IOV lifecycle 的具体参考
        title_en: No high-value direction-level change this run; Xe configfs remains a concrete GPU SR-IOV lifecycle reference
        url: https://docs.kernel.org/next/gpu/xe/xe_configfs.html
        impact_zh: pre-bind PF mode/max_vfs 与 admin-only-PF 等设计继续说明真正工作是 resource mode/provisioning/reset/isolation，而不是 generic PCI enablement。
        impact_en: Pre-bind PF mode/max_vfs and admin-only-PF design reinforce that the real work is resource mode/provisioning/reset/isolation, not generic PCI enablement.
        priority_zh: ASIC capability first
        priority_en: ASIC capability first

  - id: power
    tab_zh: 功耗 / 性能
    tab_en: Power / Perf
    name: GPU Power / Performance
    summary_zh: 负责 GPU measurement、DVFS、runtime PM、thermal 与 power budget。
    summary_en: Own GPU measurement, DVFS, runtime PM, thermal and power budget.
    entry_zh: busy/idle + reusable utilization telemetry → DVFS → runtime PM。
    entry_en: busy/idle + reusable utilization telemetry → DVFS → runtime PM.
    topics:
      - Busy/Idle / Per-engine Utilization
      - Runtime PM / Suspend-Resume / PCI D-states
      - Clock / Power Gating / Idle Residency
      - DVFS / OPP / Firmware PM Protocol
      - Thermal Throttling / Power Cap
      - Frequency Residency / Memory-bandwidth Telemetry
    updates:
      - title_zh: 本期无高价值方向级新增；Xe Runtime PM 继续强化 outer-reference / reclaim / VRAM lifetime correctness
        title_en: No high-value direction-level change; Xe Runtime PM continues to emphasize outer references, reclaim and VRAM lifetime correctness
        url: https://docs.kernel.org/next/gpu/xe/xe_pm.html
        impact_zh: IOCTL、dma-buf、GPU execution 等应从高层持有 PM lifetime；先解决 reference/resource ordering/resume correctness，再做复杂 governor。
        impact_en: IOCTL, dma-buf and GPU execution paths should hold PM lifetime at outer layers; solve reference/resource-ordering/resume correctness before complex governors.
        priority_zh: 现在
        priority_en: Now

  - id: ras
    tab_zh: 可靠性 / RAS
    tab_en: Reliability / RAS
    name: GPU Reliability / Recovery / RAS
    summary_zh: 负责故障 detect → diagnose → contain → recover，并形成生产级 RAS。
    summary_en: Own fault detect → diagnose → contain → recover, ultimately forming production-grade RAS.
    entry_zh: Frozen hang snapshot + devcoredump + FW log + reset reason + heartbeat/watchdog；中期增加 management-facing health/recovery contract。
    entry_en: Frozen hang snapshot + devcoredump + FW logs + reset reason + heartbeat/watchdog; add a management-facing health/recovery contract next.
    topics:
      - Heartbeat / Watchdog / Hang Detection
      - Hang Snapshot / devcoredump / Reset Reason
      - Job Abort / Queue Kill / Context Kill / Engine Reset
      - Post-reset Restore / Replay
      - Firmware Crash Recovery / FW Log Retention
      - ECC / Bad-page Retirement / PCIe AER / Fault Injection
    updates:
      - title_zh: Xe GPU Health Indicator / Device Wedging 把 RAS 延伸到管理面稳定契约
        title_en: Xe GPU Health Indicator / Device Wedging extends RAS into a stable management contract
        url: https://docs.kernel.org/next/gpu/xe/xe_device.html
        impact_zh: 生产 RAS 应分为 raw evidence → KMD classify/recovery policy → health state/recovery hint；上层管理工具不应靠解析 dmesg 猜 GPU 是否健康。
        impact_en: Production RAS should separate raw evidence → KMD classification/recovery policy → health state/recovery hint instead of making management tools parse logs.
        priority_zh: Snapshot/heartbeat 现在；health contract 6–12 个月
        priority_en: Snapshot/heartbeat now; health contract in 6–12 months
      - title_zh: snapshot-before-reset 继续保持硬约束
        title_en: snapshot-before-reset remains the hard invariant
        url: https://docs.kernel.org/next/gpu/xe/xe_devcoredump.html
        impact_zh: destructive recovery 前先冻结 versioned evidence，之后 offline tooling 独立消费。
        impact_en: Freeze versioned evidence before destructive recovery and let offline tooling consume it independently.
        priority_zh: 现在
        priority_en: Now

  - id: multi
    tab_zh: Multi-GPU
    tab_en: Multi-GPU
    name: Multi-GPU / P2P / Fabric
    summary_zh: 负责 multi-device model、topology/connectivity、P2P 与 fabric；page residency/migration policy 归 Memory。
    summary_en: Own the multi-device model, topology/connectivity, P2P and fabric; page residency/migration policy belongs to Memory.
    entry_zh: Enumeration + stable identity + topology + visibility/affinity + P2P capability matrix。
    entry_en: Enumeration + stable identity + topology + visibility/affinity + P2P capability matrix.
    topics:
      - Multi-GPU Enumeration / Stable Identity
      - Device Visibility / Affinity / Namespace / Cgroup
      - PCIe / NUMA / Switch Topology
      - P2P Capability / Peer BAR / Peer PTE
      - P2P DMA / Cross-GPU dma-buf
      - Shared VA / Multi-GPU VM / Fabric Health
    updates:
      - title_zh: 本期无新的生产级方向变化；fabric_ext 仍是长期 research signal
        title_en: No new production-level direction change; fabric_ext remains a long-term research signal
        url: https://arxiv.org/abs/2607.26335
        impact_zh: movement/ordering/ownership/link-health 值得长期预留语义，但当前继续 topology-first，不产品化 programmable fabric policy。
        impact_en: Movement/ordering/ownership/link-health semantics deserve long-term room, but remain topology-first now without productizing programmable fabric policy.
        priority_zh: topology/P2P 当前；fabric policy 长期
        priority_en: topology/P2P now; fabric policy long-term

  - id: obs
    tab_zh: 可观测性 / Profiling
    tab_en: Observability / Profiling
    name: GPU Observability / Profiling / Programmable Driver Infrastructure
    summary_zh: 负责 software trace + hardware PMU + 跨层 timeline/attribution + programmable diagnostics。
    summary_en: Own software trace + hardware PMU + cross-layer timeline/attribution + programmable diagnostics.
    entry_zh: Stable event/object identity + eBPF KMD tracing + low-overhead software counters；HW PMU 成熟后加入同一 timeline。
    entry_en: Stable event/object identity + eBPF KMD tracing + low-overhead software counters; join HW PMU into the same timeline when mature.
    topics:
      - Stable KMD Tracepoint / Event Model
      - BTF / CO-RE / eBPF Dynamic Tracing
      - PID / PASID / VM / Context / Queue / Job Correlation
      - UMD→KMD→FW→GPU Unified Timeline
      - GPU PMU / Counter Discovery / Sampling / Multiplexing
      - perf_event / Dynamic Diagnostics / Programmable Hooks
    updates:
      - title_zh: Xe GT Statistics 展示 always-on 低开销 KMD software telemetry 层
        title_en: Xe GT Statistics demonstrates an always-on low-overhead KMD software-telemetry layer
        url: https://docs.kernel.org/next/gpu/xe/xe_gt_stats.html
        impact_zh: per-CPU counters 可覆盖 SVM/TLB/migration/scheduler/reclaim 高频路径并避免昂贵原子操作；应与 tracepoint/object ID/PMU 组成三层 observability。
        impact_en: Per-CPU counters can cover SVM/TLB/migration/scheduler/reclaim hot paths without expensive atomics; combine them with tracepoint/object IDs and PMU into a three-layer observability model.
        priority_zh: software counters + object model 现在
        priority_en: Software counters + object model now
      - title_zh: SysOM-AI 继续验证 continuous cross-layer observability 的长期价值
        title_en: SysOM-AI continues to validate the long-term value of continuous cross-layer observability
        url: https://arxiv.org/abs/2603.29235
        impact_zh: CPU/GPU/NCCL/eBPF 的统一关联说明稳定 timestamp/object identity 应作为基础设施而非一次性 debug script。
        impact_en: CPU/GPU/NCCL/eBPF correlation reinforces stable timestamps/object identity as infrastructure rather than one-off debug scripts.
        priority_zh: 现在
        priority_en: Now

  - id: fw
    tab_zh: Firmware / Control Plane
    tab_en: Firmware / Control Plane
    name: GPU Firmware / Control Plane Architecture
    summary_zh: 负责 KMD↔GPU system firmware 的 protocol、lifecycle、capability、resource ownership 与 state reconciliation。
    summary_en: Own KMD↔GPU system-firmware protocol, lifecycle, capability, resource ownership and state reconciliation.
    entry_zh: Versioned async protocol + capability negotiation + boot/reset phase/generation + restart state reconciliation。
    entry_en: Versioned async protocol + capability negotiation + boot/reset phase/generation + restart state reconciliation.
    topics:
      - Versioned Firmware ABI / Command & Event Namespace
      - Shared-memory / Ring / Mailbox Transport
      - Sequence ID / Async Completion / Timeout / Error
      - Capability Negotiation / Forward-Backward Compatibility
      - Boot / Restart / Upgrade / Rollback Lifecycle
      - Resource Ownership / State Reconciliation
      - FW-centric Init / PM / Reset / HW Scheduler Services
      - FW Health / Logs / Authentication / Measurement
    updates:
      - title_zh: Nova devinit 强化 reset→secure FW→device init→host ready 的 phase/generation 模型
        title_en: Nova devinit strengthens a reset→secure-FW→device-init→host-ready phase/generation model
        url: https://docs.kernel.org/next/gpu/nova/core/devinit.html
        impact_zh: control plane 不应只有 fw_ready 布尔值；应显式表达 RESET/SECURE_FW/DEVINIT/GFW_BOOT/HANDSHAKE/SERVICE_READY，并让 reset/restart generation 隔离旧 request/completion。
        impact_en: The control plane should model RESET/SECURE_FW/DEVINIT/GFW_BOOT/HANDSHAKE/SERVICE_READY rather than a single fw_ready bit, with generations isolating stale requests/completions.
        priority_zh: 现在设计
        priority_en: Design now
      - title_zh: nova-core 继续以 firmware-version-independent API 服务 nova-drm/VFIO 等第二层 driver
        title_en: nova-core continues to provide firmware-version-independent APIs to nova-drm/VFIO-style second-level drivers
        url: https://docs.kernel.org/next/gpu/nova/core/guidelines.html
        impact_zh: version translation/capability/resource lifecycle 继续保持在稳定 service API 以下。
        impact_en: Keep version translation/capability/resource lifecycle below stable service APIs.
        priority_zh: 现在
        priority_en: Now

