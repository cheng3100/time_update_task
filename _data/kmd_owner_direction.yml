memory_stages:
  - title_zh: 1 · 切入
    title_en: 1 · Entry
    body_zh: Recoverable fault → PASID/VM/context → mm_struct/HMM → migration → GPU PTE → TLB invalidate → replay。目标是单 GPU 完整 correctness 闭环。
    body_en: Recoverable fault → PASID/VM/context → mm_struct/HMM → migration → GPU PTE → TLB invalidate → replay. Build a complete single-GPU correctness loop.
  - title_zh: 2 · 深化
    title_en: 2 · Deepen
    body_zh: GPUVM lifetime + migration granularity + large/compound pages + oversubscription/eviction/reclaim。4K correctness 后进入 batched/64K/2M。
    body_en: GPUVM lifetime + migration granularity + large/compound pages + oversubscription/eviction/reclaim. Move from 4K correctness to batched/64K/2M.
  - title_zh: 3 · 拓展
    title_en: 3 · Expand
    body_zh: SVA/IOMMU/ATS/PRI + NUMA + dma-buf/P2P memory。形成 CPU VA、GPUVM、IOMMU 与 peer memory 的统一 ownership 边界。
    body_en: SVA/IOMMU/ATS/PRI + NUMA + dma-buf/P2P memory. Unify ownership boundaries across CPU VA, GPUVM, IOMMU and peer memory.
  - title_zh: 4 · 演进
    title_en: 4 · Evolve
    body_zh: Multi-GPU UVM + tiered/CXL memory + preferred-location/access-counter/migration/QoS policy，最终成为 heterogeneous-memory architecture owner。
    body_en: Multi-GPU UVM + tiered/CXL memory + preferred-location/access-counter/migration/QoS policy, evolving into heterogeneous-memory architecture ownership.
