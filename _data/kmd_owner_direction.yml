current_run: "2026-08-29 Weekly #3"

owners:
  - id: memory
    tab_zh: Memory
    tab_en: Memory
    name: GPU Memory / Virtual Memory / Unified Memory
    summary_zh: 负责从 GPUVM、Linux MM 集成到 unified/heterogeneous memory 的完整内存架构，是 KMD Leader 的纵深主线。
    summary_en: Own the full memory architecture from GPUVM and Linux MM integration to unified/heterogeneous memory; the KMD leader depth line.
    entry_zh: Recoverable fault + HMM + migration + replay；第一版建立 measurement / invalidation / teardown / reset-generation correctness，并为未来 remote mapping/invalidation 解耦数据模型。
    entry_en: Recoverable fault + HMM + migration + replay; establish measurement/invalidation/teardown/reset-generation correctness first while keeping the model evolvable for future remote mapping/invalidation.
    topics:
      - GPUVM / Page Tables / VMID / PASID / TLB
      - Recoverable GPU Page Fault / Fault Replay
      - mmu_notifier / HMM / SVM / Device-private Memory
      - CPU↔GPU Migration / Oversubscription / Eviction
      - NUMA / Large & Compound Pages / Migration Granularity
      - IOMMU / ATS / PRI / PASID / SVA
      - dma-buf / P2P Memory
      - Multi-GPU Unified Memory
    updates:
      - title_zh: AMD UALink 将 multi-GPU memory consistency 推进到 remote TLB shootdown / revoke / retry 的实际 KMD 协议
        title_en: AMD UALink turns multi-GPU memory consistency into a concrete remote TLB shootdown/revoke/retry KMD protocol
        url: https://mail-archive.com/amd-gfx%40lists.freedesktop.org/msg149538.html
        impact_zh: 当前 single-GPU fault/HMM 路线不变，但 logical allocation/range、local residency/PTE、peer mapping、invalidation target 与 connection generation 必须可解耦；未来 remote invalidation 不是简单遍历 GPU 做 local flush。
        impact_en: Keep the single-GPU fault/HMM path, but decouple logical allocation/range, local residency/PTE, peer mappings, invalidation targets and connection generations; future remote invalidation is more than looping local flushes.
        priority_zh: single-GPU correctness 现在；remote invalidation 架构预留
        priority_en: Single-GPU correctness now; reserve remote-invalidation architecture
      - title_zh: 本期无新的 GPU SVM common-layer 方向变化
        title_en: No new GPU-SVM common-layer direction change this run
        url: https://docs.kernel.org/next/gpu/rfc/gpusvm.html
        impact_zh: 继续 measurement-first / generation correctness，并保持 N:1 与 per-device state 可演进。
        impact_en: Keep measurement-first/generation correctness and N:1/per-device-state evolvability.
        priority_zh: 现在
        priority_en: Now

  - id: virt
    tab_zh: 虚拟化 / 安全
    tab_en: Virt / Security
    name: GPU Virtualization / Security
    summary_zh: 负责 GPU 虚拟化、资源/租户隔离以及安全机制。
    summary_en: Own GPU virtualization, resource/tenant isolation and security mechanisms.
    entry_zh: ASIC 支持 SR-IOV 时做 PF/VF provisioning/isolation + versioned admin control；否则先 capability assessment。
    entry_en: When SR-IOV exists on the ASIC, implement PF/VF provisioning/isolation plus a versioned admin control path; otherwise start with capability assessment.
    topics:
      - VFIO Passthrough / Ownership / IOMMU Isolation
      - SR-IOV PF/VF Lifecycle
      - GPU Resource Partition / VMID / Queue / Doorbell / Memory
      - PF↔VF ABI / VF FLR / Reset / Accounting
      - vGPU / Live Migration Groundwork
      - Secure Boot / Measurement / Scrub / Attestation
    updates:
      - title_zh: 本期无新的 GPU-specific SR-IOV/vGPU 机制改变 hardware-gated 路线
        title_en: No new GPU-specific SR-IOV/vGPU mechanism changes the hardware-gated plan
        url: https://docs.kernel.org/next/gpu/xe/xe_configfs.html
        impact_zh: 保持 ASIC capability first；UALink 的 peer-memory authorization 仅作为未来 fabric tenant/security 边界提醒，不提前扩展虚拟化项目。
        impact_en: Keep ASIC capability first; peer-memory authorization in UALink is only a future fabric tenant/security boundary signal, not a reason to expand virtualization now.
        priority_zh: ASIC capability first
        priority_en: ASIC capability first

  - id: power
    tab_zh: 功耗 / 性能
    tab_en: Power / Perf
    name: GPU Power / Performance
    summary_zh: 负责 GPU measurement、DVFS、runtime PM、thermal 与 power budget。
    summary_en: Own GPU measurement, DVFS, runtime PM, thermal and power budget.
    entry_zh: busy/idle + reusable utilization telemetry + async-access quiesce correctness → runtime PM / DVFS。
    entry_en: busy/idle + reusable utilization telemetry + async-access quiesce correctness → runtime PM / DVFS.
    topics:
      - Busy/Idle / Per-engine Utilization
      - Runtime PM / Suspend-Resume / PCI D-states
      - Clock / Power Gating / Idle Residency
      - DVFS / OPP / Firmware PM Protocol
      - Thermal Throttling / Power Cap
      - Frequency Residency / Memory-bandwidth Telemetry
    updates:
      - title_zh: Imagination GPU runtime-PM 修复证明 IRQ/suspend quiesce ordering 是 PM correctness 的一部分
        title_en: Imagination GPU runtime-PM fix shows IRQ/suspend quiesce ordering is part of PM correctness
        url: https://ubuntu.com/security/CVE-2026-23469
        impact_zh: PM active set 不只是 job/ioctl reference，还包括 IRQ、FW callback、fault/reset worker；suspend 必须 drain 或持有 PM lifetime，不能靠 IRQ 内临时 resume 修补。
        impact_en: The PM active set includes IRQs, FW callbacks and fault/reset workers, not only job/ioctl references; suspend must drain them or hold lifetime rather than patching access with ad-hoc IRQ-side resume.
        priority_zh: runtime PM 第一版就建立 quiesce matrix
        priority_en: Build the quiesce matrix in the first runtime-PM implementation

  - id: ras
    tab_zh: 可靠性 / RAS
    tab_en: Reliability / RAS
    name: GPU Reliability / Recovery / RAS
    summary_zh: 负责故障 detect → diagnose → contain → recover，并形成生产级 RAS。
    summary_en: Own fault detect → diagnose → contain → recover, ultimately forming production-grade RAS.
    entry_zh: Frozen snapshot + devcoredump + FW logs + reset gate/generation + health contract；为未来 fabric/connection generation 保留边界。
    entry_en: Frozen snapshot + devcoredump + FW logs + reset gate/generation + health contract, with a separate future fabric/connection-generation boundary.
    topics:
      - Heartbeat / Watchdog / Hang Detection
      - Hang Snapshot / devcoredump / Reset Reason
      - Job Abort / Queue Kill / Context Kill / Engine Reset
      - Post-reset Restore / Replay
      - Firmware Crash Recovery / FW Log Retention
      - ECC / Bad-page Retirement / PCIe AER / Fault Injection
    updates:
      - title_zh: UALink connection reset 说明 future multi-GPU RAS 需要独立 fabric/connection generation
        title_en: UALink connection reset shows future multi-GPU RAS needs a distinct fabric/connection generation
        url: https://mail-archive.com/amd-gfx%40lists.freedesktop.org/msg149538.html
        impact_zh: local GPU reset、FW restart、peer connection reset、remote mapping revoke 生命周期不同；不要用一个 reset counter 覆盖全部旧状态失效语义。
        impact_en: Local GPU reset, FW restart, peer-connection reset and remote-mapping revoke have different lifetimes; do not collapse them into one reset counter.
        priority_zh: 当前只定义 generation ownership；fabric 立项后实现
        priority_en: Define generation ownership now; implement with real fabric work
      - title_zh: Reset gate/generation 主线保持不变
        title_en: Reset gate/generation direction remains unchanged
        url: https://lwn.net/Articles/1088747/
        impact_zh: snapshot-before-reset、close admission、drain、generation transition、restore/reopen 继续作为当前 RAS 闭环。
        impact_en: Snapshot-before-reset, close admission, drain, generation transition, restore/reopen remain the current RAS loop.
        priority_zh: 现在
        priority_en: Now

  - id: multi
    tab_zh: Multi-GPU
    tab_en: Multi-GPU
    name: Multi-GPU / P2P / Fabric
    summary_zh: 负责 multi-device model、topology/connectivity、P2P 与 fabric；page residency/migration policy 归 Memory。
    summary_en: Own the multi-device model, topology/connectivity, P2P and fabric; page residency/migration policy belongs to Memory.
    entry_zh: Enumeration + stable identity + topology/port/peer model + visibility/affinity + directional P2P capability matrix。
    entry_en: Enumeration + stable identity + topology/port/peer model + visibility/affinity + directional P2P capability matrix.
    topics:
      - Multi-GPU Enumeration / Stable Identity
      - Device Visibility / Affinity / Namespace / Cgroup
      - PCIe / NUMA / Switch Topology
      - P2P Capability / Peer BAR / Peer PTE
      - P2P DMA / Cross-GPU dma-buf
      - Shared VA / Multi-GPU VM / Fabric Health
    updates:
      - title_zh: DRM Fabric RFC 提出 vendor-neutral `fabric → endpoint → port → peer` accelerator topology 公共层
        title_en: DRM Fabric RFC proposes a vendor-neutral `fabric → endpoint → port → peer` accelerator-topology common layer
        url: https://lkml.iu.edu/2608.3/00335.html
        impact_zh: 当前 topology API 应表达 directed port/peer identity、link state/counters 与 capability/reason，而不是只有 GPU×GPU bool matrix；公共 topology 与 vendor FW/memory/data path 保持分层。
        impact_en: Topology APIs should model directed port/peer identity, link state/counters and capability/reason codes rather than only a GPU×GPU boolean matrix, while separating common topology from vendor FW/memory/data paths.
        priority_zh: 现在完善 topology data model
        priority_en: Refine the topology data model now
      - title_zh: AMD UALink 95-patch 级系列把 remote memory/TLB/interrupt/reset 变成实际 KMD control/data path
        title_en: AMD's ~95-patch UALink series makes remote memory/TLB/interrupt/reset a concrete KMD control/data path
        url: https://mail-archive.com/amd-gfx%40lists.freedesktop.org/msg149538.html
        impact_zh: Multi-GPU Owner 需要长期拥有 topology/link/control primitive；Memory 继续拥有 residency/migration/shared-VA policy，不能混层。
        impact_en: Multi-GPU should own topology/link/control primitives while Memory retains residency/migration/shared-VA policy.
        priority_zh: topology/control model 现在；data path 后续
        priority_en: Topology/control model now; data path later

  - id: obs
    tab_zh: 可观测性 / Profiling
    tab_en: Observability / Profiling
    name: GPU Observability / Profiling / Programmable Driver Infrastructure
    summary_zh: 负责 software trace + hardware PMU + 跨层 timeline/attribution + programmable diagnostics。
    summary_en: Own software trace + hardware PMU + cross-layer timeline/attribution + programmable diagnostics.
    entry_zh: Stable event/object identity + eBPF KMD tracing + low-overhead software/pipeline counters；HW PMU 成熟后加入同一 timeline。
    entry_en: Stable event/object identity + eBPF KMD tracing + low-overhead software/pipeline counters; join HW PMU into the same timeline when mature.
    topics:
      - Stable KMD Tracepoint / Event Model
      - BTF / CO-RE / eBPF Dynamic Tracing
      - PID / PASID / VM / Context / Queue / Job Correlation
      - UMD→KMD→FW→GPU Unified Timeline
      - GPU PMU / Counter Discovery / Sampling / Multiplexing
      - perf_event / Dynamic Diagnostics / Programmable Hooks
    updates:
      - title_zh: DAMON/perf hardware-sampling observability RFC 强化“异步 pipeline 每一级都必须可观察”原则
        title_en: DAMON/perf hardware-sampling observability RFC reinforces stage-by-stage observability for asynchronous pipelines
        url: https://lwn.net/Articles/1089344/
        impact_zh: future GPU PMU/fabric trace 不应只暴露最终 sample count；应区分 event create/enable、HW produce、ring drop、drain/decode/consumer drop，并用 counters + tracepoints 组合诊断。
        impact_en: Future GPU PMU/fabric tracing should expose event-create/enable, HW production, ring drops and drain/decode/consumer drops rather than only final sample counts, combining counters with tracepoints.
        priority_zh: software pipeline counters 现在；HW PMU/AUX 后续
        priority_en: Software pipeline counters now; HW PMU/AUX later

  - id: fw
    tab_zh: Firmware / Control Plane
    tab_en: Firmware / Control Plane
    name: GPU Firmware / Control Plane Architecture
    summary_zh: 负责 KMD↔GPU system firmware 的 protocol、lifecycle、capability、resource ownership 与 state reconciliation。
    summary_en: Own KMD↔GPU system-firmware protocol, lifecycle, capability, resource ownership and state reconciliation.
    entry_zh: Versioned async protocol + capability/property + boot/reset generation + raw-ABI translation/validation + restart state reconciliation。
    entry_en: Versioned async protocol + capability/property + boot/reset generation + raw-ABI translation/validation + restart state reconciliation.
    topics:
      - Versioned Firmware ABI / Command & Event Namespace
      - Shared-memory / Ring / Mailbox Transport
      - Sequence ID / Async Completion / Timeout / Error
      - Capability Negotiation / Forward-Backward Compatibility
      - Boot / Restart / Upgrade / Rollback Lifecycle
      - Resource Ownership / State Reconciliation
      - FW-centric Init / PM / Reset / HW Scheduler Services
      - FW Health / Logs / Authentication / Measurement
    updates:
      - title_zh: Nova r000 GSP ABI v2 从 release-specific firmware 转向跨 release stable ABI，并成组切换 transport/queue/boot/init semantics
        title_en: Nova r000 GSP ABI v2 moves from release-specific firmware toward a cross-release stable ABI with grouped transport/queue/boot/init changes
        url: https://lkml.iu.edu/2608.2/11372.html
        impact_zh: stable KMD service 不应直接依赖 raw FW struct；明确 raw ABI → parser/validator → translation/capability → stable service boundary，并严格验证 version/vendor/length/sequence。
        impact_en: Stable KMD services should not depend directly on raw FW structs; define raw ABI → parser/validator → translation/capability → stable-service boundaries with strict version/vendor/length/sequence validation.
        priority_zh: 当前 protocol 第一版就建立
        priority_en: Build this into the first protocol version

