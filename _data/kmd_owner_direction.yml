current_run: "2026-09-12 Weekly #5"

owners:
  - id: memory
    tab_zh: Memory
    tab_en: Memory
    name: GPU Memory / Virtual Memory / Unified Memory
    summary_zh: 负责从 GPUVM、Linux MM 集成到 unified/heterogeneous memory 的完整内存架构，是 KMD Leader 的纵深主线。
    summary_en: Own the full memory architecture from GPUVM and Linux MM integration to unified/heterogeneous memory; the KMD leader depth line.
    entry_zh: Recoverable fault + HMM + migration + replay 仍为 P0；同时定义下一阶段 VRAM pressure / reclaim / eviction contract，第一版继续保证 invalidation / teardown / reset-generation / TLB completion correctness。
    entry_en: Recoverable fault + HMM + migration + replay remains P0; define the next-stage VRAM pressure/reclaim/eviction contract while preserving invalidation/teardown/reset-generation/TLB-completion correctness.
    topics:
      - GPUVM / Page Tables / VMID / PASID / TLB
      - Recoverable GPU Page Fault / Fault Replay
      - mmu_notifier / HMM / SVM / Device-private Memory
      - CPU↔GPU Migration / Oversubscription / Eviction
      - NUMA / Large & Compound Pages / Migration Granularity
      - IOMMU / ATS / PRI / PASID / SVA
      - dma-buf / P2P Memory
      - Multi-GPU Unified Memory
    updates:
      - title_zh: DMEM + TTM/IGT 把 VRAM pressure/reclaim 推进为可验证的 KMD capability
        title_en: DMEM + TTM/IGT make VRAM pressure/reclaim a verifiable KMD capability
        url: https://www.kernel.org/doc/html/v7.0/admin-guide/cgroup-v2.html
        impact_zh: 将 accounting、protection、reclaim mechanism、eviction selection 与 QoS policy 分层；在 recoverable fault/HMM P0 之后，把 VRAM Pressure + Reclaim/Eviction Contract 提升为 Memory P1。
        impact_en: Separate accounting, protection, reclaim mechanism, eviction selection and QoS policy; promote VRAM Pressure + Reclaim/Eviction Contract to Memory P1 after the fault/HMM correctness loop.
        priority_zh: P1；fault/HMM 第一版稳定后立即立项
        priority_en: P1; start after the first fault/HMM correctness loop
      - title_zh: Xe CPU-bind + ULLS migration queue 将 page-fault latency 作为独立性能目标
        title_en: Xe CPU-bind + ULLS migration queue treats page-fault latency as a first-class target
        url: https://lore.kernel.org/dri-devel/
        impact_zh: fault measurement contract 应覆盖 IRQ→resolve→migration/bind→PTE→TLB→replay 分段延迟；correctness 稳定后再评估专用低延迟 path。
        impact_en: Measure IRQ→resolve→migration/bind→PTE→TLB→replay latency by stage; evaluate a dedicated low-latency path only after correctness is stable.
        priority_zh: measurement P0；fast path P1
        priority_en: Measurement P0; fast path P1

  - id: virt
    tab_zh: 虚拟化 / 安全
    tab_en: Virt / Security
    name: GPU Virtualization / Security
    summary_zh: 负责 GPU 虚拟化、资源/租户隔离以及安全机制。
    summary_en: Own GPU virtualization, resource/tenant isolation and security mechanisms.
    entry_zh: ASIC 支持 SR-IOV 时做 PF/VF provisioning/isolation + versioned admin control + recovery semantics，并为未来 VF migration 建立 stable logical resource ID 与 serialize/restore boundary；否则先 capability assessment。
    entry_en: When SR-IOV exists, implement PF/VF provisioning/isolation, versioned admin control and recovery semantics, with stable logical resource IDs and serialize/restore boundaries for future migration; otherwise start with capability assessment.
    topics:
      - VFIO Passthrough / Ownership / IOMMU Isolation
      - SR-IOV PF/VF Lifecycle
      - GPU Resource Partition / VMID / Queue / Doorbell / Memory
      - PF↔VF ABI / VF FLR / Reset / Accounting
      - vGPU / Live Migration Groundwork
      - Secure Boot / Measurement / Scrub / Attestation
    updates:
      - title_zh: Xe VF migration 向 multi-queue 扩展，强化可序列化 GPU resource state 的需求
        title_en: Xe VF migration extends toward multi-queue, strengthening serializable GPU resource state
        url: https://lore.kernel.org/dri-devel/
        impact_zh: VM/page-table、queue-group、doorbell/IRQ、FW scheduler/resource、VRAM 与 recovery generation 都需要 stable logical ID 和 serialize/restore boundary；queue 不能默认视为独立 migration unit。
        impact_en: VM/page-table, queue-group, doorbell/IRQ, FW scheduler/resource, VRAM and recovery-generation state need stable logical IDs and serialize/restore boundaries; queues are not automatically independent migration units.
        priority_zh: 架构 P1；完整 live migration 后续
        priority_en: Architecture P1; full live migration later

  - id: power
    tab_zh: 功耗 / 性能
    tab_en: Power / Perf
    name: GPU Power / Performance
    summary_zh: 负责 GPU measurement、DVFS、runtime PM、thermal 与 power budget。
    summary_en: Own GPU measurement, DVFS, runtime PM, thermal and power budget.
    entry_zh: busy/idle + reusable utilization telemetry + async-access quiesce correctness → runtime PM / DVFS；PM/FW feature lifecycle 显式区分 capability、readiness 与 safe enable phase。
    entry_en: busy/idle + reusable utilization telemetry + async-access quiesce correctness → runtime PM/DVFS; explicitly separate PM/FW capability, readiness and safe enable phase.
    topics:
      - Busy/Idle / Per-engine Utilization
      - Runtime PM / Suspend-Resume / PCI D-states
      - Clock / Power Gating / Idle Residency
      - DVFS / OPP / Firmware PM Protocol
      - Thermal Throttling / Power Cap
      - Frequency Residency / Memory-bandwidth Telemetry
    updates:
      - title_zh: AMD UCLK DPM 修复说明 capability 不等于当前阶段可安全启用
        title_en: AMD UCLK DPM fix shows capability does not imply safe enablement at the current phase
        url: https://lore.kernel.org/amd-gfx/
        impact_zh: PM/FW interface 要区分 capability、dependency readiness、safe enable phase、ACK、post-enable validation 与 rollback；继续 measurement/lifetime-first。
        impact_en: PM/FW interfaces should distinguish capability, dependency readiness, safe enable phase, ACK, post-enable validation and rollback while remaining measurement/lifetime-first.
        priority_zh: 当前 PM/FW interface 设计
        priority_en: Current PM/FW interface design

  - id: ras
    tab_zh: 可靠性 / RAS
    tab_en: Reliability / RAS
    name: GPU Reliability / Recovery / RAS
    summary_zh: 负责故障 detect → diagnose → contain → recover，并形成生产级 RAS。
    summary_en: Own fault detect → diagnose → contain → recover, ultimately forming production-grade RAS.
    entry_zh: Frozen snapshot + devcoredump + FW logs + Recovery Admission/State/Sequence Contract，并新增 Recovery Scope + Escalation 层级。
    entry_en: Frozen snapshot + devcoredump + FW logs + Recovery Admission/State/Sequence Contract, extended with Recovery Scope + Escalation levels.
    topics:
      - Heartbeat / Watchdog / Hang Detection
      - Hang Snapshot / devcoredump / Reset Reason
      - Job Abort / Queue Kill / Context Kill / Engine Reset
      - Post-reset Restore / Replay
      - Firmware Crash Recovery / FW Log Retention
      - ECC / Bad-page Retirement / PCIe AER / Fault Injection
    updates:
      - title_zh: Xe cold-reset recovery 将 RAS 从 reset gate 推进到 recovery scope / escalation
        title_en: Xe cold-reset recovery pushes RAS from a reset gate toward recovery scope/escalation
        url: https://lore.kernel.org/dri-devel/
        impact_zh: 统一定义 context/queue/engine/FW/device-warm/PCI/cold-reset/permanent-failure 层级，并为每级明确 handle validity、VRAM preservation、replay 与 userspace cooperation。
        impact_en: Define context/queue/engine/FW/device-warm/PCI/cold-reset/permanent-failure levels with explicit handle validity, VRAM preservation, replay and userspace-cooperation semantics.
        priority_zh: Recovery Contract 现在
        priority_en: Recovery Contract now
      - title_zh: AMDGPU gfx1150 regression 强调验证 recovery outcome 和 fault containment
        title_en: AMDGPU gfx1150 regression reinforces validating recovery outcome and fault containment
        url: https://lore.kernel.org/amd-gfx/
        impact_zh: fault-injection matrix 要验证一个 context fault 是否扩散到 MES/KFD/device，并记录 fault scope × recovery scope × unaffected queues × post-reset admission。
        impact_en: Fault-injection should verify whether a context fault spreads into MES/KFD/device and record fault scope × recovery scope × unaffected queues × post-reset admission.
        priority_zh: 当前 recovery validation P0
        priority_en: Current recovery-validation P0

  - id: multi
    tab_zh: Multi-GPU
    tab_en: Multi-GPU
    name: Multi-GPU / P2P / Fabric
    summary_zh: 负责 multi-device model、topology/connectivity、P2P 与 fabric；page residency/migration policy 归 Memory。
    summary_en: Own the multi-device model, topology/connectivity, P2P and fabric; page residency/migration policy belongs to Memory.
    entry_zh: Enumeration + stable identity + topology/port/peer model + visibility/affinity + directional P2P capability matrix。
    entry_en: Enumeration + stable identity + topology/port/peer model + visibility/affinity + directional P2P capability matrix.
    topics:
      - Multi-GPU Enumeration / Stable Identity
      - Device Visibility / Affinity / Namespace / Cgroup
      - PCIe / NUMA / Switch Topology
      - P2P Capability / Peer BAR / Peer PTE
      - P2P DMA / Cross-GPU dma-buf
      - Shared VA / Multi-GPU VM / Fabric Health
    updates: []

  - id: obs
    tab_zh: 可观测性 / Profiling
    tab_en: Observability / Profiling
    name: GPU Observability / Profiling / Programmable Driver Infrastructure
    summary_zh: 负责 software trace + hardware PMU + 跨层 timeline/attribution + programmable diagnostics。
    summary_en: Own software trace + hardware PMU + cross-layer timeline/attribution + programmable diagnostics.
    entry_zh: Stable object/event/error identity + eBPF KMD tracing + low-overhead counters + unified telemetry service；HW PMU 成熟后加入同一 timeline。
    entry_en: Stable object/event/error identity + eBPF KMD tracing + low-overhead counters + unified telemetry service; join HW PMU into the same timeline when mature.
    topics:
      - Stable KMD Tracepoint / Event Model
      - BTF / CO-RE / eBPF Dynamic Tracing
      - PID / PASID / VM / Context / Queue / Job Correlation
      - UMD→KMD→FW→GPU Unified Timeline
      - GPU PMU / Counter Discovery / Sampling / Multiplexing
      - perf_event / Dynamic Diagnostics / Programmable Hooks
    updates:
      - title_zh: DRM_RAS netlink / error threshold / structured SIGID 推动 GPU error observability 形成稳定 schema
        title_en: DRM_RAS netlink / error threshold / structured SIGID push GPU error observability toward a stable schema
        url: https://lore.kernel.org/dri-devel/
        impact_zh: stable error_id/object identity/severity/source/timestamp/generation/counter/threshold/recovery-result 应成为 trace/eBPF/devcoredump/FW log/management event 共用的数据模型。
        impact_en: Stable error ID/object identity/severity/source/timestamp/generation/counter/threshold/recovery result should be shared across trace/eBPF/devcoredump/FW logs/management events.
        priority_zh: P0/P1 schema work
        priority_en: P0/P1 schema work

  - id: fw
    tab_zh: Firmware / Control Plane
    tab_en: Firmware / Control Plane
    name: GPU Firmware / Control Plane Architecture
    summary_zh: 负责 KMD↔GPU system firmware 的 protocol、lifecycle、capability、resource ownership 与 state reconciliation。
    summary_en: Own KMD↔GPU system-firmware protocol, lifecycle, capability, resource ownership and state reconciliation.
    entry_zh: Versioned async protocol + capability/property + boot/reset generation + raw-ABI translation/validation + service readiness + restart reconciliation；新增 protocol authoritative-state discipline。
    entry_en: Versioned async protocol + capability/property + boot/reset generation + raw-ABI translation/validation + service readiness + restart reconciliation, plus authoritative protocol-state discipline.
    topics:
      - Versioned Firmware ABI / Command & Event Namespace
      - Shared-memory / Ring / Mailbox Transport
      - Sequence ID / Async Completion / Timeout / Error
      - Capability Negotiation / Forward-Backward Compatibility
      - Boot / Restart / Upgrade / Rollback Lifecycle
      - Resource Ownership / State Reconciliation
      - FW-centric Init / PM / Reset / HW Scheduler Services
      - FW Health / Logs / Authentication / Measurement
    updates:
      - title_zh: Xe mailbox PHASE 修复强调 protocol state 必须有唯一 authoritative truth source
        title_en: Xe mailbox PHASE fix reinforces one authoritative truth source for protocol state
        url: https://lore.kernel.org/dri-devel/
        impact_zh: 对 producer/consumer index、phase/epoch、seq、generation、capability snapshot 明确 ownership；reset/reconnect 时定义 reread、re-handshake、regenerate 与 stale-completion 规则。
        impact_en: Define ownership for producer/consumer indices, phase/epoch, sequence, generation and capability snapshots; reset/reconnect must specify reread, re-handshake, regenerate and stale-completion rules.
        priority_zh: 当前 Firmware protocol 第一版
        priority_en: Current first Firmware protocol design

