current_run: "2026-08-08 Test #4 · Deep Resource Mix"

owners:
  - id: memory
    tab_zh: Memory
    tab_en: Memory
    name: GPU Memory / Virtual Memory / Unified Memory
    summary_zh: 负责从 GPUVM、Linux MM 集成到 unified/heterogeneous memory 的完整内存架构，是 KMD Leader 的纵深主线。
    summary_en: Own the full memory architecture from GPUVM and Linux MM integration to unified/heterogeneous memory; the KMD leader depth line.
    entry_zh: Recoverable fault + HMM + migration + replay；第一版即明确 MMU invalidation / teardown / reset generation correctness，第二阶段进入 migration granularity。
    entry_en: Recoverable fault + HMM + migration + replay; define MMU-invalidation/teardown/reset-generation correctness from the first version, then move into migration granularity.
    topics:
      - GPUVM / Page Tables / VMID / PASID / TLB
      - Recoverable GPU Page Fault / Fault Replay
      - mmu_notifier / HMM / SVM / Device-private Memory
      - CPU↔GPU Migration / Oversubscription / Eviction
      - NUMA / Large & Compound Pages / Migration Granularity
      - IOMMU / ATS / PRI / PASID / SVA
      - dma-buf / P2P Memory
      - Multi-GPU Unified Memory
    updates:
      - title_zh: GPU SVM N:1 per-device state 对未来 multi-GPU 数据模型更关键
        title_en: GPU SVM N:1 per-device state is increasingly important for future multi-GPU data models
        url: https://docs.kernel.org/next/gpu/rfc/gpusvm.html
        impact_zh: 一个 logical CPU range 可共享 notifier，同时维护 per-device DMA mapping state；不要把 range identity、device residency、DMA mapping、GPU PTE state 合成一个对象。
        impact_en: One logical CPU range can share a notifier while retaining per-device DMA mapping state; do not conflate range identity, device residency, DMA mapping and GPU PTE state.
        priority_zh: 架构兼容现在
        priority_en: Design compatibility now
      - title_zh: fault/migration 第一版应把 notifier sequence 与 KMD generation 一起设计
        title_en: First fault/migration implementation should combine notifier sequencing with KMD generations
        url: https://docs.kernel.org/mm/hmm.html
        impact_zh: MMU notifier 解决 CPU 页表失效竞态，但 VM/context/reset 生命周期仍需 KMD generation；这是 fault replay correctness 的核心。
        impact_en: MMU notifier sequencing handles CPU page-table invalidation races, while VM/context/reset lifetimes still need KMD generations; this is central to replay correctness.
        priority_zh: 现在
        priority_en: Now

  - id: virt
    tab_zh: 虚拟化 / 安全
    tab_en: Virt / Security
    name: GPU Virtualization / Security
    summary_zh: 负责 GPU 虚拟化、资源/租户隔离以及安全机制。
    summary_en: Own GPU virtualization, resource/tenant isolation and security mechanisms.
    entry_zh: ASIC 支持 SR-IOV 时做 PF/VF provisioning/isolation；否则先 capability assessment。
    entry_en: When SR-IOV exists on the ASIC, do PF/VF provisioning/isolation; otherwise start with capability assessment.
    topics:
      - VFIO Passthrough / Ownership / IOMMU Isolation
      - SR-IOV PF/VF Lifecycle
      - GPU Resource Partition / VMID / Queue / Doorbell / Memory
      - PF↔VF ABI / VF FLR / Reset / Accounting
      - vGPU / Live Migration Groundwork
      - Secure Boot / Measurement / Scrub / Attestation
    updates:
      - title_zh: VFIO CXL Type-2 passthrough v3 扩展到 CXL.mem-capable accelerator
        title_en: VFIO CXL Type-2 passthrough v3 extends passthrough to CXL.mem-capable accelerators
        url: https://lwn.net/Articles/1079613/
        impact_zh: 未来 accelerator passthrough 可能还需要 HDM decoder、memory region 与 component-register virtualization，不再只是 BAR/IRQ/IOMMU mapping。
        impact_en: Future accelerator passthrough may need HDM decoders, memory regions and component-register virtualization beyond BAR/IRQ/IOMMU mapping.
        priority_zh: 长期观察；有 CXL roadmap 时提前设计
        priority_en: Long-term watch; design early only with a CXL roadmap
      - title_zh: Intel 当前多代 GPU 继续把 SR-IOV 作为生产虚拟化方向
        title_en: Intel continues to use SR-IOV as the production virtualization direction across current GPU families
        url: https://www.intel.com/content/www/us/en/support/articles/000093216/graphics/processor-graphics.html
        impact_zh: 方向真实存在，但自研 KMD 仍必须 ASIC capability-first；真正工作是 GPU resource partition/reset/isolation，不是 generic PCI API。
        impact_en: The direction is real, but a self-developed KMD must remain ASIC-capability-first; the real work is GPU resource partition/reset/isolation, not generic PCI APIs.
        priority_zh: Capability assessment first
        priority_en: Capability assessment first

  - id: power
    tab_zh: 功耗 / 性能
    tab_en: Power / Perf
    name: GPU Power / Performance
    summary_zh: 负责 GPU measurement、DVFS、runtime PM、thermal 与 power budget。
    summary_en: Own GPU measurement, DVFS, runtime PM, thermal and power budget.
    entry_zh: busy/idle + reusable utilization telemetry → DVFS → runtime PM。
    entry_en: busy/idle + reusable utilization telemetry → DVFS → runtime PM.
    topics:
      - Busy/Idle / Per-engine Utilization
      - Runtime PM / Suspend-Resume / PCI D-states
      - Clock / Power Gating / Idle Residency
      - DVFS / OPP / Firmware PM Protocol
      - Thermal Throttling / Power Cap
      - Frequency Residency / Memory-bandwidth Telemetry
    updates:
      - title_zh: 本期无改变路线的高价值新机制；继续 measurement/lifetime-first
        title_en: No high-value mechanism changes the direction this run; stay measurement/lifetime-first
        url: https://docs.kernel.org/gpu/xe/xe_pm.html
        impact_zh: telemetry 应可同时供 DVFS 与 Profiling 使用；Runtime PM 先解决 active reference、resource ordering 与 resume correctness，再追求复杂 policy。
        impact_en: Telemetry should serve both DVFS and profiling; Runtime PM should solve active references, resource ordering and resume correctness before complex policy.
        priority_zh: 现在
        priority_en: Now

  - id: ras
    tab_zh: 可靠性 / RAS
    tab_en: Reliability / RAS
    name: GPU Reliability / Recovery / RAS
    summary_zh: 负责故障 detect → diagnose → contain → recover，并形成生产级 RAS。
    summary_en: Own fault detect → diagnose → contain → recover, ultimately forming production-grade RAS.
    entry_zh: Frozen hang snapshot + devcoredump + FW log + reset reason + heartbeat/watchdog。
    entry_en: Frozen hang snapshot + devcoredump + FW logs + reset reason + heartbeat/watchdog.
    topics:
      - Heartbeat / Watchdog / Hang Detection
      - Hang Snapshot / devcoredump / Reset Reason
      - Job Abort / Queue Kill / Context Kill / Engine Reset
      - Post-reset Restore / Replay
      - Firmware Crash Recovery / FW Log Retention
      - ECC / Bad-page Retirement / PCIe AER / Fault Injection
    updates:
      - title_zh: 跨厂商 crash tooling 都在向结构化 post-mortem artifact 演进
        title_en: Cross-vendor crash tooling is converging on richer structured post-mortem artifacts
        url: https://gpuopen.com/learn/radeon-developer-tool-suite-amd-rdna4/
        impact_zh: KMD coredump 应逐步包含 workload/execution marker、MMU/page-fault、FW log、HW state 等 versioned section，离线工具独立消费。
        impact_en: KMD coredumps should evolve toward versioned workload/execution-marker, MMU/page-fault, FW-log and HW-state sections consumed by offline tools.
        priority_zh: Snapshot schema 现在；rich correlation 6–12 个月
        priority_en: Snapshot schema now; richer correlation in 6–12 months
      - title_zh: snapshot-before-reset 仍是硬约束
        title_en: snapshot-before-reset remains the hard invariant
        url: https://docs.kernel.org/gpu/xe/xe_devcoredump.html
        impact_zh: destructive recovery 前冻结唯一有效证据；FW logs 与 early boot/probe failures 进入同一诊断架构。
        impact_en: Freeze the only useful evidence before destructive recovery; include FW logs and early boot/probe failures in the same diagnostic architecture.
        priority_zh: 现在
        priority_en: Now

  - id: multi
    tab_zh: Multi-GPU
    tab_en: Multi-GPU
    name: Multi-GPU / P2P / Fabric
    summary_zh: 负责 multi-device model、topology/connectivity、P2P 与 fabric；page residency/migration policy 归 Memory。
    summary_en: Own the multi-device model, topology/connectivity, P2P and fabric; page residency/migration policy belongs to Memory.
    entry_zh: Enumeration + stable identity + topology + visibility/affinity + P2P capability matrix。
    entry_en: Enumeration + stable identity + topology + visibility/affinity + P2P capability matrix.
    topics:
      - Multi-GPU Enumeration / Stable Identity
      - Device Visibility / Affinity / Namespace / Cgroup
      - PCIe / NUMA / Switch Topology
      - P2P Capability / Peer BAR / Peer PTE
      - P2P DMA / Cross-GPU dma-buf
      - Shared VA / Multi-GPU VM / Fabric Health
    updates:
      - title_zh: fabric_ext 把 movement / ordering / ownership 提升为 fabric 语义
        title_en: fabric_ext elevates movement / ordering / ownership into explicit fabric semantics
        url: https://arxiv.org/abs/2607.26335
        impact_zh: 长期 Fabric interface 可能要表达 movement、ownership、ordering、link health，而不仅是 peer-copy；当前仍 topology-first。
        impact_en: Long-term Fabric interfaces may need movement, ownership, ordering and link-health semantics beyond peer-copy; near-term remains topology-first.
        priority_zh: 长期观察；当前先 topology/P2P
        priority_en: Long-term watch; topology/P2P now
      - title_zh: GPU SVM N:1 再次支持 per-device view 与 shared logical VA 分离
        title_en: GPU SVM N:1 again supports separating per-device views from shared logical VA
        url: https://docs.kernel.org/next/gpu/rfc/gpusvm.html
        impact_zh: Multi-GPU owner 先提供 identity/topology/peer capability，Memory owner 再建立 shared-VA residency/migration policy。
        impact_en: Multi-GPU should provide identity/topology/peer capability first; Memory can build shared-VA residency/migration policy on top.
        priority_zh: 现在设计兼容
        priority_en: Design compatibility now

  - id: obs
    tab_zh: 可观测性 / Profiling
    tab_en: Observability / Profiling
    name: GPU Observability / Profiling / Programmable Driver Infrastructure
    summary_zh: 负责 software trace + hardware PMU + 跨层 timeline/attribution + programmable diagnostics。
    summary_en: Own software trace + hardware PMU + cross-layer timeline/attribution + programmable diagnostics.
    entry_zh: Stable event/object identity + eBPF KMD tracing；HW PMU 成熟后加入同一 timeline。
    entry_en: Stable event/object identity + eBPF KMD tracing; join HW PMU into the same timeline when mature.
    topics:
      - Stable KMD Tracepoint / Event Model
      - BTF / CO-RE / eBPF Dynamic Tracing
      - PID / PASID / VM / Context / Queue / Job Correlation
      - UMD→KMD→FW→GPU Unified Timeline
      - GPU PMU / Counter Discovery / Sampling / Multiplexing
      - perf_event / Dynamic Diagnostics / Programmable Hooks
    updates:
      - title_zh: SysOM-AI 验证 continuous cross-layer observability 可在大规模 GPU 生产环境低开销运行
        title_en: SysOM-AI validates low-overhead continuous cross-layer observability at large GPU production scale
        url: https://arxiv.org/abs/2603.29235
        impact_zh: 稳定 object ID、timestamp 与 CPU/GPU/NCCL/KMD 关联是长期基础设施，而不是一次性 debug script；论文报告在 8 万+ GPU 部署并保持低于 0.4% overhead。
        impact_en: Stable object IDs, timestamps and CPU/GPU/NCCL/KMD correlation are durable infrastructure rather than one-off debug scripts; the paper reports deployment across 80K+ GPUs below 0.4% overhead.
        priority_zh: Trace/object model 现在
        priority_en: Trace/object model now
      - title_zh: Radeon GPU Profiler 2.7 继续体现 timeline + HW counter 的统一消费模型
        title_en: Radeon GPU Profiler 2.7 reinforces a unified timeline + hardware-counter consumption model
        url: https://gpuopen.com/rgp/
        impact_zh: GPU PMU 不应独立成寄存器读取工具；counter discovery/sampling 应能关联 queue/job/context timeline。
        impact_en: GPU PMU should not become a standalone register-reading tool; counter discovery/sampling should correlate with queue/job/context timelines.
        priority_zh: PMU 6–12 个月（硬件成熟时）
        priority_en: PMU in 6–12 months when hardware is ready

  - id: fw
    tab_zh: Firmware / Control Plane
    tab_en: Firmware / Control Plane
    name: GPU Firmware / Control Plane Architecture
    summary_zh: 负责 KMD↔GPU system firmware 的 protocol、lifecycle、capability、resource ownership 与 state reconciliation。
    summary_en: Own KMD↔GPU system-firmware protocol, lifecycle, capability, resource ownership and state reconciliation.
    entry_zh: Versioned async protocol + capability negotiation + restart generation/state reconciliation。
    entry_en: Versioned async protocol + capability negotiation + restart generation/state reconciliation.
    topics:
      - Versioned Firmware ABI / Command & Event Namespace
      - Shared-memory / Ring / Mailbox Transport
      - Sequence ID / Async Completion / Timeout / Error
      - Capability Negotiation / Forward-Backward Compatibility
      - Boot / Restart / Upgrade / Rollback Lifecycle
      - Resource Ownership / State Reconciliation
      - FW-centric Init / PM / Reset / HW Scheduler Services
      - FW Health / Logs / Authentication / Measurement
    updates:
      - title_zh: Nova 继续把 firmware-version-independent API 明确成 lower-layer invariant
        title_en: Nova continues to define firmware-version-independent APIs as a lower-layer invariant
        url: https://docs.kernel.org/next/gpu/nova/core/guidelines.html
        impact_zh: 二级 DRM/VFIO client 不应看到 FW-version-specific 结构/语义；version translation/capability 必须在稳定 service API 以下。
        impact_en: Second-level DRM/VFIO clients should not see FW-version-specific structures/semantics; version translation/capability belongs below stable service APIs.
        priority_zh: 现在
        priority_en: Now
      - title_zh: NVK→Nova 初始 backend 是 upper client 开始接入新 KMD 的早期生态信号
        title_en: Initial NVK→Nova backend work is an early ecosystem signal of upper clients wiring to the new KMD
        url: https://www.reddit.com/r/linux_gaming/comments/1vbighb/draft_nvk_add_initial_support_for_nova_driver/
        impact_zh: 当前仍非常早期，只支持 enumeration/basic VRAM properties；更说明 lower ABI/capability 必须允许 upper client 与 KMD 并行演进。
        impact_en: It is still very early, limited to enumeration/basic VRAM properties; this further argues for lower ABI/capability contracts that let upper clients and KMD evolve independently.
        priority_zh: 架构观察；不绑定早期 uAPI
        priority_en: Architecture watch; do not bind to early uAPI

