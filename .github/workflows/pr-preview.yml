name: Preview GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'docs/**'
      - '.github/workflows/pr-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.preview_url.outputs.url }}
    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-tree

      - name: Checkout PR site
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-tree

      - name: Assemble site with isolated PR preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp -a main-tree/docs/. site/
          if [[ "${{ github.event.action }}" != "closed" ]]; then
            preview_dir="site/pr-preview/pr-${{ github.event.pull_request.number }}"
            mkdir -p "$preview_dir"
            cp -a pr-tree/docs/. "$preview_dir/"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Compute preview URL
        id: preview_url
        shell: bash
        run: |
          if [[ "${{ github.event.action }}" == "closed" ]]; then
            echo "url=${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.deployment.outputs.page_url }}pr-preview/pr-${{ github.event.pull_request.number }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Add preview link to PR
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pages-pr-preview -->';
            const url = '${{ steps.preview_url.outputs.url }}';
            const body = `${marker}\n### GitHub Pages preview\n\n[Open PR preview](${url})\n\nThis preview mirrors the PR's \`docs/\` under an isolated path. The site root remains the current \`main\` version.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
