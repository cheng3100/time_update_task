<!doctype html><html data-lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU KMD Owner Direction</title><link rel="stylesheet" href="../assets/site.css"></head><body><main class="shell"><div class="topbar"><a href="../" id="back"></a><button class="lang-toggle" id="langToggle" type="button"></button></div><header class="hero"><h1>GPU KMD Owner Direction</h1><p class="muted" id="subtitle"></p></header><div class="tabs" id="tabs"></div><div id="content"></div><div class="foot" id="footer"></div></main><script>
const L={zh:{back:'← 所有任务',toggle:'English',subtitle:'稳定的 Owner 大方向 + 持续演进的切入 Feature、子方向与业界最新动态。',home:'首页',future:'公共未来 Topic',stable:'稳定',stableSummary:'稳定 Summary',living:'持续更新',industry:'业界最新动态',sub:'子方向',entry:'当前切入',priority:'跟进判断',footer:'Stable Summary 只在明确修改 Owner 方向时变化；切入 Feature、子方向优先级和 Industry Updates 随每次定时更新刷新。'},en:{back:'← All tasks',toggle:'中文',subtitle:'Stable owner domains + living entry features, sub-directions and latest industry updates.',home:'Home',future:'Future Kernel Topic',stable:'Stable',stableSummary:'Stable summary',living:'Living',industry:'Industry Updates',sub:'Sub-directions',entry:'Current entry',priority:'Follow-up',footer:'Stable summaries change only on explicit owner-direction decisions. Entry features, sub-direction priorities and Industry Updates refresh on every scheduled update.'}};
const owners=[
{id:'memory',tab:'Memory',name:'GPU Memory / Virtual Memory / Unified Memory',summary:{zh:'负责从 GPUVM、Linux MM 集成一直到 unified/heterogeneous memory 的 GPU 内存架构，是 KMD Leader 的纵深主线。',en:'Own GPU memory architecture from GPUVM through Linux MM integration and unified/heterogeneous memory. This is the KMD leader depth line.'},entry:{zh:'Recoverable GPU fault + HMM + CPU/GPU migration + replay。',en:'Recoverable GPU fault + HMM + CPU/GPU migration + replay.'},subs:['GPUVM/page table、VMID/PASID、TLB、sparse/large pages','recoverable GPU page fault / fault replay','mmu_notifier、HMM/SVM、device-private memory','CPU↔GPU migration、oversubscription、eviction','NUMA、compound/large device pages','IOMMU/ATS/PRI/PASID/SVA','dma-buf/P2P memory、multi-GPU unified memory','heterogeneous/tiered/CXL memory、memory QoS'],updates:[{d:'2026-08-08',zh:'Linux DRM GPU SVM / drm_pagemap 正在推动 system RAM ↔ device memory migration、device-private page 和未来 multi-GPU/compound page 的公共抽象。',en:'Linux DRM GPU SVM / drm_pagemap is pushing common abstractions for system-RAM ↔ device-memory migration, device-private pages, and future multi-GPU/compound-page support.',p:'现在：设计 HMM/migration 时提前兼容 common abstraction'}]},
{id:'virt',tab:{zh:'虚拟化 / 安全',en:'Virt / Security'},name:'GPU Virtualization / Security',summary:{zh:'负责 GPU 虚拟化、租户/资源隔离与安全机制，使 GPU 能够安全支持 multi-tenant 场景。',en:'Own GPU virtualization, tenant/resource isolation and security mechanisms for safe multi-tenant GPU use.'},entry:{zh:'ASIC 支持时优先 SR-IOV PF/VF bring-up + provisioning/isolation；否则先做 VFIO/reset/ownership assessment。',en:'Prioritize SR-IOV PF/VF bring-up + provisioning/isolation when ASIC capability exists; otherwise start with VFIO/reset/ownership assessment.'},subs:['VFIO passthrough、ownership/reset/BAR/MSI/IOMMU isolation','SR-IOV PF/VF lifecycle、resource provisioning','VMID/queue/doorbell/interrupt/memory partition','PF↔VF ABI、VF FLR/reset、per-VF accounting/isolation','vGPU/resource partition、tenant quota、virtual interrupt','live migration groundwork','secure boot/measurement、memory scrub、secure reset','attestation/confidential GPU'],updates:[{d:'2026-08-08',zh:'Linux/Nova 一类新架构开始把硬件/FW abstraction 设计成可同时服务 DRM 与 VFIO/vGPU manager，强化 control-plane 与 virtualization 的架构交叉。',en:'Nova-style Linux architectures are designing hardware/firmware abstraction layers that can serve DRM and VFIO/vGPU managers, strengthening the control-plane/virtualization intersection.',p:'6–12 个月：先看 ASIC SR-IOV/resource-partition 能力再立项'}]},
{id:'power',tab:{zh:'功耗 / 性能',en:'Power / Perf'},name:'GPU Power / Performance',summary:{zh:'负责 GPU power-state 控制与性能管理策略，从基础测量一直到 DVFS、runtime PM、thermal 和 power budget。',en:'Own GPU power-state control and performance-management policy from measurement through DVFS, runtime PM, thermal and power budget.'},entry:{zh:'GPU busy/idle + utilization accounting → basic DVFS/runtime PM。',en:'GPU busy/idle + utilization accounting → basic DVFS/runtime PM.'},subs:['busy/idle、per-engine utilization accounting','runtime PM、system suspend/resume','clock/power gating、idle residency','DVFS、OPP/performance states、FW PM protocol','thermal throttling、power cap','frequency residency、memory-bandwidth utilization','workload-aware boost/throttle','PCIe ASPM/link power'],updates:[{d:'2026-08-08',zh:'Intel Xe 等 upstream GPU driver 已把 runtime PM、RC6/低功耗 residency、firmware-managed frequency policy 形成完整 PM 架构，说明“测量→策略→FW/HW 控制”仍是主流演进。',en:'Upstream GPU drivers such as Intel Xe combine runtime PM, low-power residency and firmware-managed frequency policy into a complete PM architecture, reinforcing the measurement → policy → FW/HW-control model.',p:'现在：先做可验证的 utilization accounting，避免先做复杂 governor'}]},
{id:'ras',tab:{zh:'可靠性 / RAS',en:'Reliability / RAS'},name:'GPU Reliability / Recovery / RAS',summary:{zh:'负责 GPU 故障的检测、诊断、隔离和恢复，以及生产级 RAS，并逐步提升恢复粒度。',en:'Own detection, diagnosis, containment and recovery of GPU faults plus production RAS, with progressively finer recovery granularity.'},entry:{zh:'Hang snapshot + devcoredump + persistent reset reason + heartbeat/watchdog。',en:'Hang snapshot + devcoredump + persistent reset reason + heartbeat/watchdog.'},subs:['heartbeat/watchdog、hang detection','register/ring/queue/context/VM/FW hang snapshot','devcoredump、structured crash report、reset reason','job abort、queue/context kill、engine/partial/full reset','post-reset restore、job replay','firmware crash recovery coordination','ECC CE/UE、bad-page retirement/remap、PCIe AER','fault injection、per-context fault attribution'],updates:[{d:'2026-08-08',zh:'Intel Xe 使用 devcoredump 在 reset 前冻结 hang snapshot；AMD RAS 继续体现 block-level CE/UE、bad-page 和 fault-injection 的生产级模型。',en:'Intel Xe uses devcoredump to freeze hang snapshots before reset, while AMD RAS demonstrates production block-level CE/UE, bad-page and fault-injection models.',p:'现在：snapshot/devcoredump；随后推进 fine-grained recovery'}]},
{id:'multi',tab:'Multi-GPU',name:'Multi-GPU / P2P / Fabric',summary:{zh:'负责 multi-device model、拓扑/连接机制及 peer/fabric 基础设施；memory residency/migration policy 仍归 Memory Owner。',en:'Own the multi-device model, topology/connectivity mechanisms and peer/fabric infrastructure. Memory residency/migration policy stays with Memory.'},entry:{zh:'Multi-GPU enumeration + topology + visibility/affinity + P2P capability matrix。',en:'Multi-GPU enumeration + topology + visibility/affinity + P2P capability matrix.'},subs:['multi-GPU enumeration、stable physical/logical identity','logical index↔BDF/minor mapping','device visibility、allowed mask、affinity','container/namespace/cgroup resource control','PCIe/NUMA/switch topology、distance matrix','P2P capability discovery/matrix','peer BAR/VRAM mapping、peer PTE','P2P DMA、cross-GPU dma-buf','shared VA/multi-GPU VM','fabric/link health、reset、RAS'],updates:[{d:'2026-08-08',zh:'DRM GPU SVM 公开设计已把 multi-GPU 和 device-to-device fast interconnect 纳入后续方向，说明 shared VM/migration 最终会与拓扑/P2P 机制强耦合。',en:'The DRM GPU SVM design explicitly lists multi-GPU and device-to-device fast interconnect as future work, showing that shared VM/migration will increasingly couple with topology and P2P mechanisms.',p:'现在：先建立 device/topology/P2P capability model'}]},
{id:'obs',tab:{zh:'可观测性 / Profiling',en:'Observability / Profiling'},name:'GPU Observability / Profiling / Programmable Driver',summary:{zh:'负责软件事件追踪、硬件性能监控、跨层关联和可编程诊断。eBPF 是当前切入技术，而不是 Owner 本身的定义。',en:'Own software-event tracing, hardware performance monitoring, cross-layer correlation and programmable diagnostics. eBPF is an entry technology, not the owner identity.'},entry:{zh:'eBPF-based GPU KMD dynamic tracing；HW PMU 成熟后并行 PMU counter enumeration + per-process/context profiling。',en:'eBPF-based GPU KMD dynamic tracing; add PMU counter enumeration + per-process/context profiling when HW PMU is mature.'},subs:['stable KMD tracepoint/event model','BTF/CO-RE、eBPF dynamic tracing','PID/PASID/VM/context/queue/job correlation','GPUVM/fault/migration tracing','FW/KMD/UMD unified timeline','per-process/context latency、performance attribution','dynamic diagnostics、fault injection hooks','GPU PMU counter discovery/allocation/multiplexing/sampling','SM/CU/cache/memory/fabric/engine counters','profiling uAPI、Linux perf/perf_event','tenant-safe counter virtualization','long-term gpu_ext-like programmable policy'],updates:[{d:'2026-08-08',zh:'Linux perf 已广泛承载复杂 system/uncore PMU；同时 gpu_ext 等研究开始探索 verified eBPF hooks 用于 GPU observability/policy。',en:'Linux perf already supports complex system/uncore PMUs, while research such as gpu_ext explores verified eBPF hooks for GPU observability and policy.',p:'现在：eBPF trace；PMU 成熟后做统一 timeline；programmable policy 长期观察'}]},
{id:'fw',tab:'Firmware / Control Plane',name:'GPU Firmware / Control Plane Architecture',summary:{zh:'负责长期 KMD↔GPU system firmware 的协议、生命周期、capability 和 ownership 架构，超越基础 firmware load/bring-up。',en:'Own the long-term KMD↔GPU system-firmware protocol, lifecycle, capability and ownership architecture beyond basic firmware load/bring-up.'},entry:{zh:'Versioned KMD-Firmware Async Control Protocol + Capability Negotiation。',en:'Versioned KMD-Firmware Async Control Protocol + Capability Negotiation.'},subs:['versioned FW ABI/protocol、command/event namespace','shared-memory/ring/mailbox transport','sequence ID、async completion、timeout/cancel/error','capability negotiation、compatibility','boot/handshake、upgrade/rollback、hot restart','KMD↔FW resource ownership、state reconciliation','firmware-centric init/engine management','PM/reset/hardware-scheduler interface','FW health、heartbeat、crash dump','firmware authentication/measurement'],updates:[{d:'2026-08-08',zh:'NVIDIA Nova/GSP 路线进一步强化 firmware-centric GPU driver：nova-core 试图隔离 FW version 差异，并为 DRM/VFIO 等上层提供稳定 abstraction。',en:'The NVIDIA Nova/GSP direction reinforces firmware-centric GPU drivers: nova-core aims to isolate firmware-version differences and expose stable abstractions to DRM/VFIO upper layers.',p:'现在：优先建立 version/capability/async/restart-resync 的正式 control-plane contract'}]}
];
const future={summary:{zh:'公共 Future Topic 不分配具体 Owner，只跟踪未来 1–3 年可能改变 GPU KMD 架构的 Linux GPU/accelerator kernel 与 upstream 机制。',en:'The shared Future Topic is not assigned to an owner; it tracks Linux GPU/accelerator kernel and upstream mechanisms that may change KMD architecture over the next 1–3 years.'},subs:['DRM/Accel common infrastructure','drm_gpuvm/drm_exec/drm_sched future evolution','VM_BIND/async VM_BIND、GPUVM/SVM common abstraction','dma-buf/dma-fence/syncobj evolution','compute/accelerator uAPI','device-node/namespace/cgroup/resource-control','firmware-centric/hardware-scheduler architecture','common recovery/telemetry/security/virtualization frameworks','Rust GPU drivers / driver abstraction','upstream policy、uAPI stability、ABI/versioning','MM/IOMMU/PCIe/CXL/eBPF changes affecting GPU KMD']};
let lang=localStorage.getItem('site-lang')||'zh';const root=document.documentElement;
function t(x){return typeof x==='string'?x:x[lang]}
function setLang(x){lang=x;root.dataset.lang=x;root.lang=x==='zh'?'zh-CN':'en';localStorage.setItem('site-lang',x);render()}
function renderHome(){const rows=owners.map(o=>`<tr><td>${o.name}</td><td>${t(o.entry)}</td></tr>`).join('');return `<section class="pane active" id="home"><div class="card"><div class="section-title"><h2>${lang==='zh'?'Owner 大方向':'Owner Map'}</h2><span class="badge stable">${L[lang].stable}</span></div><p>${lang==='zh'?'本页只在明确新增、删除、合并或重新定义一级方向时修改。基础 execution/submission、context/queue、scheduler、interrupt、probe/init、MMIO/PCIe 等视为已有 KMD 基础结构，不作为新的 Owner 方向。':'This page changes only when a top-level direction is explicitly added, removed, merged or redefined. Baseline execution/submission, context/queue, scheduling, interrupts, probe/init and MMIO/PCIe remain KMD foundation rather than new owner directions.'}</p><table><tr><th>${lang==='zh'?'Owner 大方向':'Owner domain'}</th><th>${L[lang].entry}</th></tr>${rows}</table></div><div class="card"><div class="section-title"><h2>${lang==='zh'?'更新规则':'Update policy'}</h2><span class="badge stable">${L[lang].stable}</span></div><ul><li>${lang==='zh'?'Stable Summary 仅在明确方向决策时修改。':'Stable summaries change only on explicit direction decisions.'}</li><li>${lang==='zh'?'每次更新刷新切入 Feature、子方向优先级以及每个 Owner 的业界最新动态。':'Every run refreshes the entry feature, sub-direction priorities and industry updates for every owner.'}</li><li>${lang==='zh'?'业界动态优先使用 upstream patchset/RFC/kernel docs/vendor open KMD，并给出跟进判断。':'Industry updates prioritize upstream patchsets/RFCs/kernel docs/vendor open KMD and include a follow-up judgment.'}</li></ul></div></section>`}
function renderOwner(o){const subs=o.subs.map(s=>`<li>${s}</li>`).join('');const updates=o.updates.map(u=>`<li><strong>${u.d}</strong> — ${t(u)}<br><span class="muted"><strong>${L[lang].priority}:</strong> ${u.p}</span></li>`).join('');return `<section class="pane" id="${o.id}"><div class="card"><div class="section-title"><h2>${o.name}</h2><span class="badge stable">${L[lang].stableSummary}</span></div><p>${t(o.summary)}</p></div><div class="card"><div class="section-title"><h3>${L[lang].sub}</h3><span class="badge living">${L[lang].living}</span></div><ul>${subs}</ul><p class="entry"><strong>${L[lang].entry}:</strong> ${t(o.entry)}</p></div><div class="card"><div class="section-title"><h3>${L[lang].industry}</h3><span class="badge living">${L[lang].living}</span></div><ul>${updates}</ul></div></section>`}
function renderFuture(){return `<section class="pane" id="future"><div class="card"><div class="section-title"><h2>${L[lang].future}</h2><span class="badge stable">${lang==='zh'?'公共 Topic，非 Owner':'Shared topic, not an owner'}</span></div><p>${t(future.summary)}</p><ul>${future.subs.map(s=>`<li>${s}</li>`).join('')}</ul></div></section>`}
function render(){document.getElementById('back').textContent=L[lang].back;document.getElementById('langToggle').textContent=L[lang].toggle;document.getElementById('subtitle').textContent=L[lang].subtitle;document.getElementById('footer').textContent=L[lang].footer;document.getElementById('tabs').innerHTML=`<button class="tab" data-tab="home">${L[lang].home}</button>`+owners.map(o=>`<button class="tab" data-tab="${o.id}">${t(o.tab)}</button>`).join('')+`<button class="tab" data-tab="future">${L[lang].future}</button>`;document.getElementById('content').innerHTML=renderHome()+owners.map(renderOwner).join('')+renderFuture();const id=location.hash.slice(1)||'home';openTab(document.getElementById(id)?id:'home');document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)))}
function openTab(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id===id));history.replaceState(null,'','#'+id)}
document.getElementById('langToggle').addEventListener('click',()=>setLang(lang==='zh'?'en':'zh'));render();
</script></body></html>
