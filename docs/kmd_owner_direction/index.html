let lang=localStorage.getItem('site-lang')||'zh',active=location.hash.slice(1)||'home';function t(v){return typeof v==='string'?v:v[lang]}function makeTabs(){return `<button class="tab ${active==='home'?'active':''}" data-id="home">${U[lang].home}</button>`+O.map(o=>`<button class="tab ${active===o.id?'active':''}" data-id="${o.id}">${t(o.tab)}</button>`).join('')+`<button class="tab ${active==='future'?'active':''}" data-id="future">${U[lang].future}</button>`}function subList(o){return `<ul>${o.subs.map(s=>`<li>${s[0]}<br><span class="muted">${U[lang].resources}: <a href="${s[2]}" target="_blank" rel="noopener">${s[1]}</a></span></li>`).join('')}</ul>`}function upd(o){return `<div class="card"><div class="section-title"><h3>${U[lang].industry}</h3><span class="badge living">Test #3</span></div>${o.updates.map(x=>`<p><strong><a href="${x.url}" target="_blank" rel="noopener">${t(x.t)}</a></strong><br>${U[lang].impact}: ${t(x.i)}<br><span class="muted">${U[lang].priority}: ${t(x.p)}</span></p>`).join('')}</div>`}function owner(o){return `<section class="pane active"><div class="card"><div class="section-title"><h2>${o.name}</h2><span class="badge stable">${U[lang].stable}</span></div><p>${t(o.s)}</p></div><div class="card"><div class="section-title"><h3>${U[lang].living}</h3><span class="badge living">Living</span></div>${subList(o)}<p class="entry"><strong>${U[lang].entry}:</strong> ${t(o.e)}</p></div>${upd(o)}</section>`}function home(){return `<section class="pane active"><div class="card"><div class="section-title"><h2>${lang==='zh'?'Owner 大方向':'Owner Map'}</h2><span class="badge stable">${U[lang].stable}</span></div><table><tr><th>Owner</th><th>${U[lang].entry}</th></tr>${O.map(o=>`<tr><td>${o.name}</td><td>${t(o.e)}</td></tr>`).join('')}</table></div><div class="card"><h2>${lang==='zh'?'本期更新模型':'Update model this run'}</h2><ul><li>${lang==='zh'?'聊天窗口保留完整报告；GitHub 是额外归档。':'The chat keeps the complete report; GitHub is additional archival.'}</li><li>${lang==='zh'
