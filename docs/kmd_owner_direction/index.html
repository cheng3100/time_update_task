const U={zh:{back:'← 所有任务',raw:'原始更新归档',mem:'Memory 详细路线',toggle:'English',subtitle:'稳定 Owner 定义 + 每次更新的切入 Feature、子方向、业界动态与路线判断。当前展示：2026-08-08 Test #2。',home:'首页',future:'公共未来 Topic',stable:'稳定 Summary',living:'持续更新',sub:'子方向',entry:'当前切入',industry:'业界最新动态',impact:'KMD 影响',priority:'优先级',roadmap:'Memory 四阶段纵深路线',footer:'Stable Summary 仅在明确方向决策时修改；Living 内容与 Industry Updates 随每次任务更新刷新。完整原文保存在 Raw Update Archive。'},en:{back:'← All tasks',raw:'Raw Update Archive',mem:'Memory Detailed Roadmap',toggle:'中文',subtitle:'Stable owner definitions plus per-run entry features, sub-directions, industry signals and roadmap decisions. Current view: 2026-08-08 Test #2.',home:'Home',future:'Future Kernel Topic',stable:'Stable summary',living:'Living',sub:'Sub-directions',entry:'Current entry',industry:'Industry Updates',impact:'KMD impact',priority:'Priority',roadmap:'Four-stage Memory depth roadmap',footer:'Stable summaries change only on explicit direction decisions. Living content and Industry Updates refresh every run. Complete outputs are kept in the Raw Update Archive.'}};
const owners=[
{id:'memory',tab:'Memory',name:'GPU Memory / Virtual Memory / Unified Memory',s:{zh:'负责从 GPUVM、Linux MM 集成到 unified/heterogeneous memory 的完整内存架构，是 KMD Leader 的纵深主线。',en:'Own the full memory architecture from GPUVM and Linux MM integration to unified/heterogeneous memory; the KMD leader depth line.'},e:{zh:'Recoverable GPU fault + HMM + CPU/GPU migration + replay；第二阶段进入 migration granularity。',en:'Recoverable GPU fault + HMM + CPU/GPU migration + replay; stage two explicitly moves into migration granularity.'},subs:['GPUVM / page tables / VMID / PASID / TLB / sparse & large pages','recoverable GPU page fault / replay','mmu_notifier / HMM / SVM / device-private memory','CPU↔GPU migration / oversubscription / eviction','NUMA / compound pages / higher-order DMA','IOMMU / ATS / PRI / PASID / SVA','dma-buf / P2P memory / multi-GPU UVM','tiered / CXL memory / memory QoS'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'DRM GPU SVM：compound pages / higher-order migration / mixed residency',en:'DRM GPU SVM: compound pages / higher-order migration / mixed residency'},url:'https://www.kernel.org/doc/html/latest/gpu/rfc/gpusvm.html',i:{zh:'不要把 4 KiB 写死为 ownership/lifetime 单位；拆分 CPU base page、migration unit、DMA mapping unit、GPU PTE unit 与 TLB unit。',en:'Do not hard-code 4 KiB as the ownership/lifetime unit; separate CPU base page, migration unit, DMA mapping unit, GPU PTE unit and TLB unit.'},p:{zh:'架构现在；64K/2M/compound/batched migration 在 6–12 个月',en:'Architecture now; 64K/2M/compound/batched migration in 6–12 months'}}]},
{id:'virt',tab:{zh:'虚拟化 / 安全',en:'Virt / Security'},name:'GPU Virtualization / Security',s:{zh:'负责 GPU 虚拟化、资源/租户隔离以及安全机制。',en:'Own GPU virtualization, resource/tenant isolation and security mechanisms.'},e:{zh:'ASIC 支持 SR-IOV 时做 PF/VF provisioning/isolation；否则先做 VFIO/reset/ownership capability assessment。',en:'When SR-IOV is real on the ASIC, do PF/VF provisioning/isolation; otherwise start with VFIO/reset/ownership capability assessment.'},subs:['VFIO passthrough / ownership / reset / IOMMU isolation','SR-IOV PF/VF lifecycle and provisioning','VMID / queue / doorbell / interrupt / memory partition','PF↔VF ABI / VF FLR / accounting / isolation','vGPU / live-migration groundwork','secure boot / scrub / attestation / confidential GPU'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'Nova：共享 lower control layer 服务 DRM 与 VFIO/vGPU',en:'Nova: shared lower control layer for DRM and VFIO/vGPU'},url:'https://docs.kernel.org/gpu/nova/index.html',i:{zh:'不要把 pci_enable_sriov() 包装成 owner 项目；真正价值是 GPU resource provisioning/reset/isolation，并应复用 Control Plane。',en:'Do not treat pci_enable_sriov() as the owner project; the real value is GPU resource provisioning/reset/isolation on top of the common Control Plane.'},p:{zh:'先确认 ASIC capability',en:'ASIC capability first'}}]},

{id:'ras',tab:{zh:'可靠性 / RAS',en:'Reliability / RAS'},name:'GPU Reliability / Recovery / RAS',s:{zh:'负责故障 detect → diagnose → contain → recover，并形成生产级 RAS。',en:'Own fault detect → diagnose → contain → recover, ultimately forming production-grade RAS.'},e:{zh:'Hang snapshot + devcoredump + persistent reset reason + heartbeat/watchdog。',en:'Hang snapshot + devcoredump + persistent reset reason + heartbeat/watchdog.'},subs:['heartbeat / watchdog / progress tracking','register / ring / queue / context / VM / FW snapshot','devcoredump / structured crash report / reset reason','job abort → queue/context kill → engine/partial/full reset','post-reset restore / replay','ECC CE/UE / bad-page retirement / AER / fault injection'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'Intel Xe devcoredump：hang 时冻结快照，reset 后再读取',en:'Intel Xe devcoredump: freeze at hang, read after reset'},url:'https://www.kernel.org/doc/html/latest/gpu/xe/xe_devcoredump.html',i:{zh:'diagnostic capture 必须早于 destructive recovery；snapshot 还应包含 FW log 与 early-boot/probe failure state。',en:'Diagnostic capture must precede destructive recovery, and snapshots should include FW logs plus early-boot/probe-failure state.'},p:{zh:'现在',en:'Now'}}]},
{id:'multi',tab:'Multi-GPU',name:'Multi-GPU / P2P / Fabric',s:{zh:'负责 multi-device model、topology/connectivity、P2P 与 fabric；page residency/migration policy 归 Memory。',en:'Own the multi-device model, topology/connectivity, P2P and fabric; page residency/migration policy belongs to Memory.'},e:{zh:'Enumeration + stable GPU identity + topology + visibility/affinity + P2P capability matrix。',en:'Enumeration + stable GPU identity + topology + visibility/affinity + P2P capability matrix.'},subs:['physical/logical GPU identity / BDF / minor mapping','visibility / allowed GPU mask / affinity / namespace','PCIe / NUMA / switch topology / distance matrix','P2P capability / peer BAR / peer PTE','P2P DMA / cross-GPU dma-buf','shared VM / fabric link health & reset'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'DRM GPU SVM：multi-GPU shared-memory 后续路线',en:'DRM GPU SVM: multi-GPU shared-memory roadmap'},url:'https://www.kernel.org/doc/html/latest/gpu/rfc/gpusvm.html',i:{zh:'当前仍应 topology-first：先建立 identity/topology/P2P matrix，再进入 peer mapping/shared VM/multi-GPU UVM。',en:'Stay topology-first: establish identity/topology/P2P matrix before peer mapping, shared VM and multi-GPU UVM.'},p:{zh:'当前 feature 立即；fabric policy 长期观察',en:'Current feature now; fabric policy long-term watch'}},{d:'2026-07-28',t:{zh:'fabric_ext：GPU/DPU/CXL movement / ownership / ordering 可编程策略',en:'fabric_ext: programmable GPU/DPU/CXL movement / ownership / ordering policy'},url:'https://arxiv.org/abs/2607.26335',i:{zh:'长期 topology/fabric interface 可能需要暴露 movement、ordering、ownership 与 link-health，而不只是 peer-copy capability。',en:'Long-term topology/fabric interfaces may need movement, ordering, ownership and link-health semantics, not just peer-copy capability.'},p:{zh:'长期观察，不产品化',en:'Long-term watch; do not productize now'}}]},
{id:'obs',tab:{zh:'可观测性 / Profiling',en:'Observability / Profiling'},name:'GPU Observability / Profiling / Programmable Driver Infrastructure',s:{zh:'负责 software trace + hardware PMU + 跨层 timeline/attribution + programmable diagnostics。',en:'Own software tracing + hardware PMU + cross-layer timeline/attribution + programmable diagnostics.'},e:{zh:'eBPF KMD dynamic tracing；HW PMU 成熟后加入 per-process/context profiling。',en:'eBPF KMD dynamic tracing; add per-process/context profiling when HW PMU is mature.'},subs:['stable KMD tracepoint/event schema','BTF/CO-RE / kprobe / fentry/fexit / tracepoint','PID/PASID/VM/context/queue/job correlation','UMD → KMD → FW → GPU unified timeline','GPU PMU / counter discovery / perf integration','dynamic diagnostics / future verified policy hooks'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'ProfInfer：eBPF runtime trace 与 hardware-counter timeline 关联',en:'ProfInfer: correlating eBPF runtime traces with hardware-counter timelines'},url:'https://arxiv.org/abs/2601.20755',i:{zh:'不要维护两套独立 debug/profiling object model；现在先统一 timestamp/object identity，policy hooks 暂不产品化。',en:'Avoid separate debug/profiling object models; unify timestamps/object identity now and keep policy hooks out of production for the moment.'},p:{zh:'Trace 现在；PMU 6–12 个月；policy 长期',en:'Trace now; PMU in 6–12 months; policy long-term'}},{d:'2026-08-08',t:{zh:'gpu_ext：verified eBPF GPU driver policy hooks',en:'gpu_ext: verified eBPF GPU-driver policy hooks'},url:'https://arxiv.org/abs/2512.12615',i:{zh:'当前只投资 stable hooks、object correlation 与 telemetry；programmable policy 保持研究态。',en:'Invest now in stable hooks, object correlation and telemetry; keep programmable policy research-stage.'},p:{zh:'长期观察',en:'Long-term watch'}}]},
{id:'fw',tab:'Firmware / Control Plane',name:'GPU Firmware / Control Plane Architecture',s:{zh:'负责 KMD↔GPU system firmware 的 protocol、lifecycle、capability、resource ownership 与 state reconciliation。',en:'Own the KMD↔GPU system-firmware protocol, lifecycle, capability, resource ownership and state reconciliation.'},e:{zh:'Versioned async protocol + capability negotiation + restart generation/state reconciliation。',en:'Versioned async protocol + capability negotiation + restart generation/state reconciliation.'},subs:['versioned ABI / command-event namespace','sequence / async completion / timeout / error','capability negotiation / forward-backward compatibility','boot / restart / upgrade / rollback lifecycle','resource ownership / state reconciliation','PM / reset / HW-scheduler services','FW health / log / authentication'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'Nova：GSP-RM API versioning 与 firmware-version isolation',en:'Nova: GSP-RM API versioning and firmware-version isolation'},url:'https://docs.kernel.org/gpu/nova/core/todo.html',i:{zh:'集中 version translation/capability negotiation，避免 feature 内散落 fw_version 判断；FW health/log 应成为正式 control-plane service。',en:'Centralize version translation/capability negotiation, avoid scattered fw_version checks, and make FW health/log a formal control-plane service.'},p:{zh:'现在',en:'Now'}},{d:'2026-08-08',t:{zh:'Nova core：可复用 HW/FW abstraction 服务多个 upper driver',en:'Nova core: reusable HW/FW abstraction for multiple upper drivers'},url:'https://docs.kernel.org/gpu/nova/index.html',i:{zh:'resource ownership 与 firmware lifecycle 应位于 client/uAPI 层之下。',en:'Resource ownership and firmware lifecycle should live below client/uAPI layers.'},p:{zh:'现在做架构',en:'Architecture now'}}]}
];
const memoryStages={zh:[['1 · 切入','Recoverable fault → PASID/VM/context → mm_struct/HMM → migration → GPU PTE → TLB invalidate → replay。目标是单 GPU 完整 correctness 闭环。'],['2 · 深化','GPUVM lifetime + migration granularity + large/compound pages + oversubscription/eviction/reclaim。4K correctness 后进入 batched/64K/2M。'],['3 · 拓展','SVA/IOMMU/ATS/PRI + NUMA + dma-buf/P2P memory。形成 CPU VA、GPUVM、IOMMU 与 peer memory 的统一 ownership 边界。'],['4 · 演进','Multi-GPU UVM + tiered/CXL memory + preferred-location/access-counter/migration/QoS policy，最终成为 heterogeneous-memory architecture owner。']],en:[['1 · Entry','Recoverable fault → PASID/VM/context → mm_struct/HMM → migration → GPU PTE → TLB invalidate → replay. Build a complete single-GPU correctness loop.'],['2 · Deepen','GPUVM lifetime + migration granularity + large/compound pages + oversubscription/eviction/reclaim. Move from 4K correctness to batched/64K/2M.'],['3 · Expand','SVA/IOMMU/ATS/PRI + NUMA + dma-buf/P2P memory. Unify ownership boundaries across CPU VA, GPUVM, IOMMU and peer memory.'],['4 · Evolve','Multi-GPU UVM + tiered/CXL memory + preferred-location/access-counter/migration/QoS policy, evolving into heterogeneous-memory architecture ownership.']]};
const future={s:{zh:'公共 Topic 不分配 Owner，只追踪未来 1–3 年可能改变 KMD 架构的 Linux GPU/accelerator upstream 机制。',en:'The shared topic is not assigned to an owner; it tracks Linux GPU/accelerator upstream mechanisms that may change KMD architecture in 1–3 years.'},subs:['DRM GPU SVM / drm_pagemap','DRM/Accel common infrastructure','VM_BIND / async VM_BIND / GPUVM common abstractions','firmware-centric / hardware-scheduler architecture','Rust GPU driver abstractions','MM / IOMMU / PCIe / CXL / eBPF changes','uAPI stability / ABI versioning / upstream policy'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'Linux DRM GPU SVM：shared VA / migration common infrastructure',en:'Linux DRM GPU SVM: shared-VA / migration common infrastructure'},url:'https://www.kernel.org/doc/html/latest/gpu/rfc/gpusvm.html',i:{zh:'GPU SVM commonization 与 Nova firmware-centric layering 值得现在做架构兼容；programmable fabric/eBPF policy 长期观察。',en:'Design now for GPU SVM commonization and Nova firmware-centric layering; keep programmable fabric/eBPF policy as long-term research.'},p:{zh:'架构兼容现在',en:'Architecture compatibility now'}},{d:'2026-08-08',t:{zh:'Linux Nova：firmware-centric 两层 GPU driver architecture',en:'Linux Nova: firmware-centric two-level GPU driver architecture'},url:'https://docs.kernel.org/gpu/nova/index.html',i:{zh:'关注 lower HW/FW control abstraction 如何服务 DRM、VFIO/vGPU 等不同 upper driver。',en:'Track how a lower HW/FW control abstraction can serve DRM, VFIO/vGPU and other upper drivers.'},p:{zh:'现在作为架构参考',en:'Architecture reference now'}}]};
const team=[['KMD leader','Recoverable fault + HMM + migration/replay','Memory / UVM'],['Engineer A','Versioned FW ABI + async protocol','Firmware / Control Plane'],['Engineer B','Hang snapshot + devcoredump + FW log','Reliability / RAS'],['Engineer C','Multi-GPU identity + topology + P2P capability','Multi-GPU / Fabric'],['Engineer D','KMD tracepoint schema + eBPF object correlation','Observability / Profiling'],['Engineer E','SR-IOV if ASIC supports it; otherwise utilization + DVFS','Virtualization or Power']];
let lang=localStorage.getItem('site-lang')||'zh',active=location.hash.slice(1)||'home';const t=x=>typeof x==='string'?x:x[lang];
function updateCard(x){return `<div class="industry-item"><h4>${x.d}</h4><p><a href="${x.url}" target="_blank" rel="noopener"><strong>${t(x.t)} ↗</strong></a></p><p><strong>${U[lang].impact}:</strong> ${t(x.i)}</p><p><strong>${U[lang].priority}:</strong> ${t(x.p)}</p></div>`}
function ownerPane(o){const roadmap=o.id==='memory'?`<div class="card"><div class="section-title"><h3>${U[lang].roadmap}</h3><span class="badge living">Owner depth</span></div>${memoryStages[lang].map(s=>`<div class="entry"><strong>${s[0]}</strong><br>${s[1]}</div>`).join('')}<p><a href="./memory-roadmap.html">${U[lang].mem} →</a></p></div>`:'';return `<section class="pane ${active===o.id?'active':''}" id="${o.id}"><div class="card"><div class="section-title"><h2>${o.name}</h2><span class="badge stable">${U[lang].stable}</span></div><p>${t(o.s)}</p></div><div class="card"><div class="section-title"><h3>${U[lang].sub}</h3><span class="badge living">${U[lang].living}</span></div><ul>${o.subs.map(x=>`<li>${x}</li>`).join('')}</ul><p class="entry"><strong>${U[lang].entry}:</strong> ${t(o.e)}</p></div>${roadmap}<div class="card"><div class="section-title"><h3>${U[lang].industry}</h3><span class="badge living">2026-08-08 · Test #2</span></div>${o.updates.map(updateCard).join('')}</div></section>`}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('back').textContent=U[lang].back;document.getElementById('rawLink').textContent=U[lang].raw;document.getElementById('memLink').textContent=U[lang].mem;document.getElementById('langToggle').textContent=U[lang].toggle;document.getElementById('subtitle').textContent=U[lang].subtitle;document.getElementById('footer').textContent=U[lang].footer;document.getElementById('tabs').innerHTML=`<button class="tab ${active==='home'?'active':''}" data-id="home">${U[lang].home}</button>${owners.map(o=>`<button class="tab ${active===o.id?'active':''}" data-id="${o.id}">${t(o.tab)}</button>`).join('')}<button class="tab ${active==='future'?'active':''}" data-id="future">${U[lang].future}</button>`;const ownerRows=owners.map(o=>`<tr><td>${o.name}</td><td>${t(o.e)}</td></tr>`).join('');const teamRows=team.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('');const home=`<section class="pane ${active==='home'?'active':''}" id="home"><div class="card"><div class="section-title"><h2>${lang==='zh'?'七个一级 Owner':'Seven top-level owners'}</h2><span class="badge stable">${U[lang].stable}</span></div><p>${lang==='zh'?'当前 7+1 taxonomy 保持稳定；只有明确提出方向调整时才修改。':'The current 7+1 taxonomy remains stable and changes only on an explicit direction decision.'}</p><table><tr><th>Owner</th><th>${U[lang].entry}</th></tr>${ownerRows}</table></div><div class="card"><div class="section-title"><h3>${lang==='zh'?'最近测试更新要点':'Latest test-update highlights'}</h3><span class="badge living">2026-08-08 · Test #2</span></div><ul><li>${lang==='zh'?'Memory：Recoverable fault/HMM/migration 是 P0；migration granularity 升级为第二阶段架构 feature。':'Memory: recoverable fault/HMM/migration is P0; migration granularity is promoted to a second-stage architecture feature.'}</li><li>${lang==='zh'?'Firmware：Versioned async protocol + capability negotiation 是 P0。':'Firmware: versioned async protocol + capability negotiation is P0.'}</li><li>${lang==='zh'?'Reliability：hang snapshot/devcoredump/reset reason 是 P0/P1。':'Reliability: hang snapshot/devcoredump/reset reason is P0/P1.'}</li><li>${lang==='zh'?'Multi-GPU：先 identity/topology/visibility/P2P capability，shared VM/UVM 后置。':'Multi-GPU: identity/topology/visibility/P2P capability first; shared VM/UVM later.'}</li><li>${lang==='zh'?'Observability：eBPF trace 先行，PMU/per-context profiling 第二阶段。':'Observability: eBPF tracing first; PMU/per-context profiling second.'}</li></ul></div><div class="card"><h3>${lang==='zh'?'当前 5–6 人 Feature Project':'Current 5–6 person feature projects'}</h3><table><tr><th>${lang==='zh'?'角色':'Role'}</th><th>Feature</th><th>Owner</th></tr>${teamRows}</table></div><div class="grid"><a class="task" href="./memory-roadmap.html"><strong>${U[lang].mem}</strong><br><span class="muted">${lang==='zh'?'切入 → 深化 → 拓展 → 演进':'Entry → Deepen → Expand → Evolve'}</span></a><a class="task" href="./raw-updates.html"><strong>${U[lang].raw}</strong><br><span class="muted">${lang==='zh'?'查看 Test #1 / Test #2 完整 Markdown 快照':'Open complete Test #1 / Test #2 Markdown snapshots'}</span></a></div></section>`;const futurePane=`<section class="pane ${active==='future'?'active':''}" id="future"><div class="card"><h2>${U[lang].future}</h2><p>${t(future.s)}</p><ul>${future.subs.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><div class="section-title"><h3>${U[lang].industry}</h3><span class="badge living">2026-08-08</span></div>${future.updates.map(updateCard).join('')}</div></section>`;document.getElementById('content').innerHTML=home+owners.map(ownerPane).join('')+futurePane;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;history.replaceState(null,'','#'+active);render()})}
document.getElementById('langToggle').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('site-lang',lang);render()};render();
</script></body></html>
