<!doctype html>

<body><main class="shell">
<div class="topbar"><a href="../" id="back">← 所有任务</a><div><a href="./raw-updates.html" id="rawLink">原始更新归档</a> · <a href="./memory-roadmap.html" id="memLink">Memory 详细路线</a> &nbsp; <button class="lang-toggle" id="langToggle">English</button></div></div>
<header class="hero"><h1>GPU KMD Owner Direction</h1><p class="muted" id="subtitle"></p></header>
<div class="tabs" id="tabs"></div><div id="content"></div><div class="foot" id="footer"></div>
</main>
<script>
const U={zh:{back:'← 所有任务',raw:'原始更新归档',mem:'Memory 详细路线',toggle:'English',subtitle:'稳定 Owner 定义 + 每次更新的切入 Feature、子方向、业界动态与路线判断。当前展示：2026-08-08 Test #2。',home:'首页',future:'公共未来 Topic',stable:'稳定 Summary',living:'持续更新',sub:'子方向',entry:'当前切入',industry:'业界最新动态',impact:'KMD 影响',priority:'优先级',roadmap:'Memory 四阶段纵深路线',footer:'Stable Summary 仅在明确方向决策时修改；Living 内容与 Industry Updates 随每次任务更新刷新。完整原文保存在 Raw Update Archive。'},en:{back:'← All tasks',raw:'Raw Update Archive',mem:'Memory Detailed Roadmap',toggle:'中文',subtitle:'Stable owner definitions plus per-run entry features, sub-directions, industry signals and roadmap decisions. Current view: 2026-08-08 Test #2.',home:'Home',future:'Future Kernel Topic',stable:'Stable summary',living:'Living',sub:'Sub-directions',entry:'Current entry',industry:'Industry Updates',impact:'KMD impact',priority:'Priority',roadmap:'Four-stage Memory depth roadmap',footer:'Stable summaries change only on explicit direction decisions. Living content and Industry Updates refresh every run. Complete outputs are kept in the Raw Update Archive.'}};
const owners=[
{id:'memory',tab:'Memory',name:'GPU Memory / Virtual Memory / Unified Memory',s:{zh:'负责从 GPUVM、Linux MM 集成到 unified/heterogeneous memory 的完整内存架构，是 KMD Leader 的纵深主线。',en:'Own the full memory architecture from GPUVM and Linux MM integration to unified/heterogeneous memory; the KMD leader depth line.'},e:{zh:'Recoverable GPU fault + HMM + CPU/GPU migration + replay；第二阶段进入 migration granularity。',en:'Recoverable GPU fault + HMM + CPU/GPU migration + replay; stage two explicitly moves into migration granularity.'},subs:['GPUVM / page tables / VMID / PASID / TLB / sparse & large pages','recoverable GPU page fault / replay','mmu_notifier / HMM / SVM / device-private memory','CPU↔GPU migration / oversubscription / eviction','NUMA / compound pages / higher-order DMA','IOMMU / ATS / PRI / PASID / SVA','dma-buf / P2P memory / multi-GPU UVM','tiered / CXL memory / memory QoS'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'DRM GPU SVM 明确把 compound device pages、higher-order DMA migration、mixed residency 和 multi-GPU 列入后续路线。',en:'DRM GPU SVM explicitly lists compound device pages, higher-order DMA migration, mixed residency and multi-GPU as follow-on work.'},url:'https://www.kernel.org/doc/html/latest/gpu/rfc/gpusvm.html',i:{zh:'不要把 4 KiB 写死为 ownership/lifetime 单位；拆分 CPU base page、migration unit、DMA mapping unit、GPU PTE unit 与 TLB unit。',en:'Do not hard-code 4 KiB as the ownership/lifetime unit; separate CPU base page, migration unit, DMA mapping unit, GPU PTE unit and TLB unit.'},p:{zh:'架构现在；64K/2M/compound/batched migration 在 6–12 个月',en:'Architecture now; 64K/2M/compound/batched migration in 6–12 months'}}]},
{id:'virt',tab:{zh:'虚拟化 / 安全',en:'Virt / Security'},name:'GPU Virtualization / Security',s:{zh:'负责 GPU 虚拟化、资源/租户隔离以及安全机制。',en:'Own GPU virtualization, resource/tenant isolation and security mechanisms.'},e:{zh:'ASIC 支持 SR-IOV 时做 PF/VF provisioning/isolation；否则先做 VFIO/reset/ownership capability assessment。',en:'When SR-IOV is real on the ASIC, do PF/VF provisioning/isolation; otherwise start with VFIO/reset/ownership capability assessment.'},subs:['VFIO passthrough / ownership / reset / IOMMU isolation','SR-IOV PF/VF lifecycle and provisioning','VMID / queue / doorbell / interrupt / memory partition','PF↔VF ABI / VF FLR / accounting / isolation','vGPU / live-migration groundwork','secure boot / scrub / attestation / confidential GPU'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'本期未发现改变路线的高价值 GPU-specific SR-IOV 新机制；Nova 继续验证共享 lower control layer 服务 DRM 与 VFIO/vGPU。',en:'No high-value GPU-specific SR-IOV mechanism changed the route; Nova continues to validate a shared lower control layer for DRM and VFIO/vGPU.'},url:'https://docs.kernel.org/gpu/nova/index.html',i:{zh:'不要把 pci_enable_sriov() 包装成 owner 项目；真正价值是 GPU resource provisioning/reset/isolation，并应复用 Control Plane。',en:'Do not treat pci_enable_sriov() as the owner project; the real value is GPU resource provisioning/reset/isolation on top of the common Control Plane.'},p:{zh:'先确认 ASIC capability',en:'ASIC capability first'}}]},
{id:'power',tab:{zh:'功耗 / 性能',en:'Power / Perf'},name:'GPU Power / Performance',s:{zh:'负责 GPU measurement、DVFS、runtime PM、thermal 与 power budget。',en:'Own GPU measurement, DVFS, runtime PM, thermal and power budget.'},e:{zh:'GPU busy/idle + utilization accounting → basic DVFS → runtime PM。',en:'GPU busy/idle + utilization accounting → basic DVFS → runtime PM.'},subs:['busy/idle / per-engine utilization','runtime PM / suspend-resume / PCI D-state','clock & power gating / idle residency','DVFS / OPP / FW PM protocol','thermal throttling / power cap','frequency residency / memory-bandwidth telemetry'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'现代 GPU PM 继续走 firmware-managed control；生产 profiling 也复用 GPU hardware events。',en:'Modern GPU PM continues toward firmware-managed control, while production profiling also reuses GPU hardware events.'},url:'https://www.kernel.org/doc/html/latest/gpu/xe/xe_pm.html',i:{zh:'先建立可信的 utilization/counter telemetry 层，让 DVFS、profiling 和后续 policy 共用，而不是把计数器写死在 governor。',en:'Build a trustworthy reusable utilization/counter telemetry layer for DVFS, profiling and later policy rather than embedding counters inside a governor.'},p:{zh:'现在设计；控制/PMU 成熟后落地',en:'Design now; implement when control/PMU is mature'}}]},
{id:'ras',tab:{zh:'可靠性 / RAS',en:'Reliability / RAS'},name:'GPU Reliability / Recovery / RAS',s:{zh:'负责故障 detect → diagnose → contain → recover，并形成生产级 RAS。',en:'Own fault detect → diagnose → contain → recover, ultimately forming production-grade RAS.'},e:{zh:'Hang snapshot + devcoredump + persistent reset reason + heartbeat/watchdog。',en:'Hang snapshot + devcoredump + persistent reset reason + heartbeat/watchdog.'},subs:['heartbeat / watchdog / progress tracking','register / ring / queue / context / VM / FW snapshot','devcoredump / structured crash report / reset reason','job abort → queue/context kill → engine/partial/full reset','post-reset restore / replay','ECC CE/UE / bad-page retirement / AER / fault injection'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'Xe 的 devcoredump 模式强化“hang 时冻结快照，reset 后再读取”；Nova 还强调 GSP log 在 probe 失败场景也要保留。',en:'Xe reinforces “freeze the snapshot at hang, read it after reset”; Nova also emphasizes retaining GSP logs even for probe failures.'},url:'https://www.kernel.org/doc/html/latest/gpu/xe/xe_devcoredump.html',i:{zh:'diagnostic capture 必须早于 destructive recovery；snapshot 还应包含 FW log 与 early-boot/probe failure state。',en:'Diagnostic capture must precede destructive recovery, and snapshots should include FW logs plus early-boot/probe-failure state.'},p:{zh:'现在',en:'Now'}}]},
{id:'multi',tab:'Multi-GPU',name:'Multi-GPU / P2P / Fabric',s:{zh:'负责 multi-device model、topology/connectivity、P2P 与 fabric；page residency/migration policy 归 Memory。',en:'Own the multi-device model, topology/connectivity, P2P and fabric; page residency/migration policy belongs to Memory.'},e:{zh:'Enumeration + stable GPU identity + topology + visibility/affinity + P2P capability matrix。',en:'Enumeration + stable GPU identity + topology + visibility/affinity + P2P capability matrix.'},subs:['physical/logical GPU identity / BDF / minor mapping','visibility / allowed GPU mask / affinity / namespace','PCIe / NUMA / switch topology / distance matrix','P2P capability / peer BAR / peer PTE','P2P DMA / cross-GPU dma-buf','shared VM / fabric link health & reset'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'DRM GPU SVM 已明确把 multi-GPU 放进后续工作；fabric_ext 则把 GPU/DPU/CXL movement/ownership/ordering 作为跨层策略信号。',en:'DRM GPU SVM explicitly includes multi-GPU as follow-on work, while fabric_ext treats GPU/DPU/CXL movement/ownership/ordering as a cross-layer policy signal.'},url:'https://www.kernel.org/doc/html/latest/gpu/rfc/gpusvm.html',i:{zh:'当前仍应 topology-first：先建立 identity/topology/P2P matrix，再进入 peer mapping/shared VM/multi-GPU UVM。',en:'Stay topology-first: establish identity/topology/P2P matrix before peer mapping, shared VM and multi-GPU UVM.'},p:{zh:'当前 feature 立即；fabric policy 长期观察',en:'Current feature now; fabric policy long-term watch'}}]},
{id:'obs',tab:{zh:'可观测性 / Profiling',en:'Observability / Profiling'},name:'GPU Observability / Profiling / Programmable Driver Infrastructure',s:{zh:'负责 software trace + hardware PMU + 跨层 timeline/attribution + programmable diagnostics。',en:'Own software tracing + hardware PMU + cross-layer timeline/attribution + programmable diagnostics.'},e:{zh:'eBPF KMD dynamic tracing；HW PMU 成熟后加入 per-process/context profiling。',en:'eBPF KMD dynamic tracing; add per-process/context profiling when HW PMU is mature.'},subs:['stable KMD tracepoint/event schema','BTF/CO-RE / kprobe / fentry/fexit / tracepoint','PID/PASID/VM/context/queue/job correlation','UMD → KMD → FW → GPU unified timeline','GPU PMU / counter discovery / perf integration','dynamic diagnostics / future verified policy hooks'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'ProfInfer 强化 eBPF runtime trace 与 hardware-counter trend 统一关联；gpu_ext/fabric_ext 继续提供 programmable policy 的研究信号。',en:'ProfInfer strengthens unified correlation between eBPF runtime traces and hardware-counter trends; gpu_ext/fabric_ext remain research signals for programmable policy.'},url:'https://arxiv.org/abs/2601.20755',i:{zh:'不要维护两套独立 debug/profiling object model；现在先统一 timestamp/object identity，policy hooks 暂不产品化。',en:'Avoid separate debug/profiling object models; unify timestamps/object identity now and keep policy hooks out of production for the moment.'},p:{zh:'Trace 现在；PMU 6–12 个月；policy 长期',en:'Trace now; PMU in 6–12 months; policy long-term'}}]},
{id:'fw',tab:'Firmware / Control Plane',name:'GPU Firmware / Control Plane Architecture',s:{zh:'负责 KMD↔GPU system firmware 的 protocol、lifecycle、capability、resource ownership 与 state reconciliation。',en:'Own the KMD↔GPU system-firmware protocol, lifecycle, capability, resource ownership and state reconciliation.'},e:{zh:'Versioned async protocol + capability negotiation + restart generation/state reconciliation。',en:'Versioned async protocol + capability negotiation + restart generation/state reconciliation.'},subs:['versioned ABI / command-event namespace','sequence / async completion / timeout / error','capability negotiation / forward-backward compatibility','boot / restart / upgrade / rollback lifecycle','resource ownership / state reconciliation','PM / reset / HW-scheduler services','FW health / log / authentication'],updates:[{d:'2026-08-08 · Test #2',t:{zh:'Nova 明确把 GSP-RM API 跨版本不稳定视为架构问题，并用 lower core layer 隔离 FW-version-specific 细节。',en:'Nova explicitly treats GSP-RM API instability across versions as an architectural problem and uses a lower core layer to isolate firmware-version-specific details.'},url:'https://docs.kernel.org/gpu/nova/core/todo.html',i:{zh:'集中 version translation/capability negotiation，避免 feature 内散落 fw_version 判断；FW health/log 应成为正式 control-plane service。',en:'Centralize version translation/capability negotiation, avoid scattered fw_version checks, and make FW health/log a formal control-plane service.'},p:{zh:'现在',en:'Now'}}]}
];
const memoryStages={zh:[['1 · 切入','Recoverable fault → PASID/VM/context → mm_struct/HMM → migration → GPU PTE → TLB invalidate → replay。目标是单 GPU 完整 correctness 闭环。'],['2 · 深化','GPUVM lifetime + migration granularity + large/compound pages + oversubscription/eviction/reclaim。4K correctness 后进入 batched/64K/2M。'],['3 · 拓展','SVA/IOMMU/ATS/PRI + NUMA + dma-buf/P2P memory。形成 CPU VA、GPUVM、IOMMU 与 peer memory 的统一 ownership 边界。'],['4 · 演进','Multi-GPU UVM + tiered/CXL memory + preferred-location/access-counter/migration/QoS policy，最终成为 heterogeneous-memory architecture owner。']],en:[['1 · Entry','Recoverable fault → PASID/VM/context → mm_struct/HMM → migration → GPU PTE → TLB invalidate → replay. Build a complete single-GPU correctness loop.'],['2 · Deepen','GPUVM lifetime + migration granularity + large/compound pages + oversubscription/eviction/reclaim. Move from 4K correctness to batched/64K/2M.'],['3 · Expand','SVA/IOMMU/ATS/PRI + NUMA + dma-buf/P2P memory. Unify ownership boundaries across CPU VA, GPUVM, IOMMU and peer memory.'],['4 · Evolve','Multi-GPU UVM + tiered/CXL memory + preferred-location/access-counter/migration/QoS policy, evolving into heterogeneous-memory architecture ownership.']]};
const future={s:{zh:'公共 Topic 不分配 Owner，只追踪未来 1–3 年可能改变 KMD 架构的 Linux GPU/accelerator upstream 机制。',en:'The shared topic is not assigned to an owner; it tracks Linux GPU/accelerator upstream mechanisms that may change KMD architecture in 1–3 years.'},subs:['DRM GPU SVM / drm_pagemap','DRM/Accel common infrastructure','VM_BIND / async VM_BIND / common GPUVM abstractions','firmware-centric / hardware-scheduler architecture','Rust GPU driver abstractions / Nova','MM/IOMMU/PCIe/CXL/eBPF evolution','uAPI / ABI / upstream policy'],signal:{zh:'当前最强信号：GPU SVM commonization、Nova firmware-centric layering，以及 GPU/CXL programmable-fabric research。前两项值得现在做兼容，后者长期观察。',en:'Strongest signals: GPU SVM commonization, Nova firmware-centric layering, and programmable GPU/CXL-fabric research. Design for the first two now; watch the latter long term.'}};
let lang=localStorage.getItem('site-lang')||'zh',active=location.hash.slice(1)||'home'; const T=x=>typeof x==='string'?x:x[lang];
function ownerPane(o){const roadmap=o.id==='memory'?`<div class="card"><div class="section-title"><h3>${U[lang].roadmap}</h3><span class="badge living">Owner depth</span></div>${memoryStages[lang].map(x=>`<h4>${x[0]}</h4><p>${x[1]}</p>`).join('')}<p><a href="./memory-roadmap.html">${U[lang].mem} →</a></p></div>`:'';return `<section class="pane ${active===o.id?'active':''}" id="${o.id}"><div class="card"><div class="section-title"><h2>${o.name}</h2><span class="badge stable">${U[lang].stable}</span></div><p>${T(o.s)}</p></div><div class="card"><div class="section-title"><h3>${U[lang].sub}</h3><span class="badge living">${U[lang].living}</span></div><ul>${o.subs.map(x=>`<li>${x}</li>`).join('')}</ul><p class="entry"><strong>${U[lang].entry}:</strong> ${T(o.e)}</p></div>${roadmap}<div class="card"><div class="section-title"><h3>${U[lang].industry}</h3><span class="badge living">2026-08-08 Test #2</span></div>${o.updates.map(x=>`<h4>${x.d} — ${T(x.t)}</h4><p><a href="${x.url}" target="_blank" rel="noopener">Source ↗</a></p><p><strong>${U[lang].impact}:</strong> ${T(x.i)}</p><p><strong>${U[lang].priority}:</strong> ${T(x.p)}</p>`).join('')}</div></section>`}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';back.textContent=U[lang].back;rawLink.textContent=U[lang].raw;memLink.textContent=U[lang].mem;langToggle.textContent=U[lang].toggle;subtitle.textContent=U[lang].subtitle;footer.textContent=U[lang].footer;tabs.innerHTML=`<button class="tab ${active==='home'?'active':''}" data-id="home">${U[lang].home}</button>${owners.map(o=>`<button class="tab ${active===o.id?'active':''}" data-id="${o.id}">${T(o.tab)}</button>`).join('')}<button class="tab ${active==='future'?'active':''}" data-id="future">${U[lang].future}</button>`;const rows=owners.map(o=>`<tr><td>${o.name}</td><td>${T(o.e)}</td></tr>`).join('');const home=`<section class="pane ${active==='home'?'active':''}"><div class="grid"><a class="task" href="./raw-updates.html"><strong>${U[lang].raw}</strong><br><span class="muted">2026-08-08 Test #1 / Test #2</span></a><a class="task" href="./memory-roadmap.html"><strong>${U[lang].mem}</strong><br><span class="muted">Entry → Deepen → Expand → Evolve</span></a></div><div class="card"><div class="section-title"><h2>${lang==='zh'?'七个一级 Owner':'Seven top-level owners'}</h2><span class="badge stable">${U[lang].stable}</span></div><p>${lang==='zh'?'7+1 结构保持稳定；本次测试更新不新增第 8 个 Owner。':'The 7+1 structure remains stable; this test run adds no eighth owner.'}</p><table><tr><th>Owner</th><th>${U[lang].entry}</th></tr>${rows}</table></div><div class="card"><h3>${lang==='zh'?'最近测试更新核心结论':'Latest test update — key conclusions'}</h3><ul><li>${lang==='zh'?'Memory：Recoverable fault/HMM/migration 为 P0，migration granularity 成为明确第二阶段。':'Memory: Recoverable fault/HMM/migration remains P0; migration granularity is now an explicit second stage.'}</li><li>${lang==='zh'?'Firmware：Versioned async KMD↔FW protocol + capability negotiation 提升为 P0。':'Firmware: Versioned async KMD↔FW protocol + capability negotiation is promoted to P0.'}</li><li>${lang==='zh'?'RAS：先做 hang-time snapshot/devcoredump/reset reason，再演进分级 recovery。':'RAS: Start with hang-time snapshot/devcoredump/reset reason, then evolve a graded recovery ladder.'}</li><li>${lang==='zh'?'Multi-GPU：先 identity/topology/visibility/P2P matrix，不直接跳到 multi-GPU UVM。':'Multi-GPU: Build identity/topology/visibility/P2P matrix first; do not jump directly to multi-GPU UVM.'}</li><li>${lang==='zh'?'Observability：eBPF trace 先行，PMU/per-context profiling 第二阶段，programmable policy 长期观察。':'Observability: eBPF trace first, PMU/per-context profiling second, programmable policy long-term.'}</li></ul></div><div class="card"><h3>${lang==='zh'?'当前 5–6 人项目映射':'Current 5–6 person project mapping'}</h3><table><tr><th>${lang==='zh'?'角色':'Role'}</th><th>Feature</th></tr><tr><td>Leader</td><td>Recoverable fault + HMM + migration/replay</td></tr><tr><td>A</td><td>Versioned KMD↔FW async protocol</td></tr><tr><td>B</td><td>Hang snapshot + devcoredump + reset reason</td></tr><tr><td>C</td><td>Multi-GPU identity/topology/P2P capability</td></tr><tr><td>D</td><td>eBPF KMD trace + object correlation</td></tr><tr><td>E</td><td>SR-IOV if ASIC supports it; otherwise utilization + DVFS/runtime PM</td></tr></table></div></section>`;const fp=`<section class="pane ${active==='future'?'active':''}"><div class="card"><h2>${U[lang].future}</h2><p>${T(future.s)}</p><ul>${future.subs.map(x=>`<li>${x}</li>`).join('')}</ul><p>${T(future.signal)}</p></div></section>`;content.innerHTML=home+owners.map(ownerPane).join('')+fp;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;history.replaceState(null,'','#'+active);render()})}
langToggle.onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('site-lang',lang);render()};render();
</script></body></html>
