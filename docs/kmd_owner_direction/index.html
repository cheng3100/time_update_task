function updateCard(u){return `<div class="card"><div class="section-title"><h3>${tr(u.title)}</h3><span class="badge living">${u.date}</span></div><p><strong>${UI[lang].source}:</strong> ${link(u.url,u.source)}</p><p><strong>${UI[lang].change}:</strong> ${tr(u.change)}</p><p><strong>${UI[lang].impact}:</strong> ${tr(u.impact)}</p><p><strong>${UI[lang].priority}:</strong> ${tr(u.priority)}</p></div>`}
function homePane(){const rows=owners.map(o=>`<tr><td>${o.name}</td><td>${tr(o.entry)}</td></tr>`).join('');return `<section class="pane active" id="home"><div class="card"><div class="section-title"><h2>${lang==='zh'?'Owner 大方向':'Owner Map'}</h2><span class="badge stable">${UI[lang].stable}</span></div><p>${lang==='zh'?'一级方向与 Stable Summary 长期保持稳定，仅在明确提出新增/删除/合并/重定义时修改。基础 execution/submission、context/queue、scheduler、interrupt、probe/init、MMIO/PCIe 等仍属于既有 KMD 基础结构。':'Top-level domains and stable summaries remain stable and change only on explicit add/remove/merge/redefinition decisions. Baseline execution/submission, context/queue, scheduling, interrupts, probe/init and MMIO/PCIe remain existing KMD foundation.'}</p><table><tr><th>${lang==='zh'?'Owner 大方向':'Owner domain'}</th><th>${UI[lang].entry}</th></tr>${rows}</table></div><div class="card"><div class="section-title"><h2>${UI[lang].latest}</h2><span class="badge living">Living</span></div><ol>${owners.slice(0,5).map(o=>`<li><strong>${o.name}</strong> — ${tr(o.entry)}</li>`).join('')}</ol><p>${lang==='zh'?'完整测试发布已归档到 kmd_owner_direction/updates/2026-08-08.md；每个 Owner 的 Industry Updates 在对应 Tab 中独立维护。':'The full test release is archived in kmd_owner_direction/updates/2026-08-08.md; each Owner maintains its own Industry Updates in the corresponding tab.'}</p></div></section>`}
function ownerPane(o){return `<section class="pane" id="${o.id}"><div class="card"><div class="section-title"><h2>${o.name}</h2><span class="badge stable">${UI[lang].stable}</span></div><p>${tr(o.summary)}</p></div><div class="card"><div class="section-title"><h3>${UI[lang].sub}</h3><span class="badge living">${UI[lang].living}</span></div><ul>${o.subs.map(s=>`<li>${subText(s)}</li>`).join('')}</ul><p class="entry"><strong>${UI[lang].entry}:</strong> ${tr(o.entry)}</p></div><div class="section-title"><h2>${UI[lang].industry}</h2><span class="badge living">${UI[lang].latest}</span></div>${o.updates.map(updateCard).join('')}</section>`}
function futurePane(){return `<section class="pane" id="future"><div class="card"><div class="section-title"><h2>${lang==='zh'?'公共未来演进 Topic':'Public Future Evolution Topic'}</h2><span class="badge stable">${lang==='zh'?'公共 Topic，非具体 Owner':'Shared topic, not an owner'}</span></div><p>${lang==='zh'?'只跟踪未来 1–3 年可能改变 GPU KMD 架构的 Linux GPU/accelerator kernel、DRM/Accel、uAPI、upstream 与跨子系统机制，不重复已有 KMD 基础功能。':'Track only future-facing Linux GPU/accelerator kernel, DRM/Accel, uAPI, upstream and cross-subsystem mechanisms that may change KMD architecture over the next 1–3 years; do not repeat existing KMD foundation.'}</p></div>${future.map(updateCard).join('')}</section>`}
function setLang(v){lang=v;root.dataset.lang=v;root.lang=v==='zh'?'zh-CN':'en';localStorage.setItem('site-lang',v);render()}
function openTab(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id===id));history.replaceState(null,'','#'+id)}
function render(){document.getElementById('back').textContent=UI[lang].back;document.getElementById('langToggle').textContent=UI[lang].toggle;document.getElementById('subtitle').textContent=UI[lang].subtitle;document.getElementById('footer').textContent=UI[lang].footer;document.getElementById('tabs').innerHTML=`<button class="tab" data-tab="home">${UI[lang].home}</button>`+owners.map(o=>`<button class="tab" data-tab="${o.id}">${tr(o.tab)}</button>`).join('')+`<button class="tab" data-tab="future">${UI[lang].future}</button>`;document.getElementById('content').innerHTML=homePane()+owners.map(ownerPane).join('')+futurePane();document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));const id=location.hash.slice(1);openTab(document.getElementById(id)?id:'home')}
document.getElementById('langToggle').addEventListener('click',()=>setLang(lang==='zh'?'en':'zh'));render();
</script>
</body>
</html>
