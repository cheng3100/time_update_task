<!doctype html>
<html data-lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU KMD Owner Direction</title><link rel="stylesheet" href="../assets/site.css"></head>
<body><main class="shell"><div class="topbar"><a href="../" id="back"></a><button class="lang-toggle" id="langToggle" type="button"></button></div><header class="hero"><h1>GPU KMD Owner Direction</h1><p class="muted" id="subtitle"></p></header><div class="tabs" id="tabs"></div><div id="content"></div><div class="foot" id="footer"></div></main>
<script>
const U={zh:{back:'← 所有任务',toggle:'English',subtitle:'稳定 Owner 定义 + 持续更新的 Feature、子方向与业界动态。当前：2026-08-08 Test #2',home:'首页',future:'公共未来 Topic',stable:'稳定 Summary',living:'持续更新',sub:'子方向',entry:'当前切入',industry:'业界最新动态',impact:'KMD 影响',priority:'优先级',footer:'Stable Summary 仅在明确方向决策时修改；Living 内容按每次更新刷新，并保留 dated history。'},en:{back:'← All tasks',toggle:'中文',subtitle:'Stable owner definitions + living features, sub-directions and industry updates. Current: 2026-08-08 Test #2',home:'Home',future:'Future Kernel Topic',stable:'Stable summary',living:'Living',sub:'Sub-directions',entry:'Current entry',industry:'Industry Updates',impact:'KMD impact',priority:'Priority',footer:'Stable summaries change only on explicit direction decisions. Living content refreshes each run while dated history is retained.'}};
const O=[
{id:'memory',tab:'Memory',name:'GPU Memory / Virtual Memory / Unified Memory',s:{zh:'负责 GPUVM、Linux MM 集成以及 unified/heterogeneous memory，是 KMD Leader 的纵深主线。',en:'Own GPUVM, Linux MM integration and unified/heterogeneous memory; the KMD leader depth line.'},e:{zh:'Recoverable GPU fault + HMM + migration + replay；第二阶段显式进入 migration granularity。',en:'Recoverable GPU fault + HMM + migration + replay; explicitly add migration granularity as stage two.'},subs:['GPUVM / page table / PASID / TLB','recoverable fault / replay','HMM/SVM / device-private memory','CPU↔GPU migration / eviction / oversubscription','NUMA / compound pages / higher-order DMA','IOMMU ATS/PRI/PASID/SVA','multi-GPU UVM / CXL / tiered memory'],u:[{d:'2026-08-08 · Test #2',t:{zh:'DRM GPU SVM 明确把 compound device pages、higher-order DMA migration、mixed residency 和 multi-GPU 列入后续路线。',en:'DRM GPU SVM explicitly lists compound device pages, higher-order DMA migration, mixed residency and multi-GPU as follow-on work.'},url:'https://www.kernel.org/doc/html/latest/gpu/rfc/gpusvm.html',i:{zh:'不要把 4K 写死为 ownership/lifetime 单位；拆分 base page、migration unit、DMA mapping unit、GPU PTE unit。',en:'Do not hard-code 4K as the ownership/lifetime unit; separate base page, migration unit, DMA mapping unit and GPU PTE unit.'},p:{zh:'架构现在；64K/2M/批量迁移 6–12 个月',en:'Architecture now; 64K/2M/batched migration in 6–12 months'}}]},
{id:'virt',tab:{zh:'虚拟化 / 安全',en:'Virt / Security'},name:'GPU Virtualization / Security',s:{zh:'负责 GPU 虚拟化、资源/租户隔离和安全机制。',en:'Own GPU virtualization, resource/tenant isolation and security mechanisms.'},e:{zh:'有 SR-IOV 硬件能力时做 PF/VF provisioning/isolation；否则只做 capability assessment。',en:'Do PF/VF provisioning/isolation when SR-IOV hardware exists; otherwise perform capability assessment only.'},subs:['VFIO / ownership / reset / IOMMU isolation','SR-IOV PF/VF resource provisioning','VMID / doorbell / interrupt / memory partition','PF↔VF ABI / FLR / accounting','vGPU / live migration groundwork','secure boot / scrub / attestation'],u:[{d:'2026-08-08 · Test #2',t:{zh:'本次未发现改变路线的高价值 GPU-specific SR-IOV 新机制；Nova 继续强化共用 lower control layer 服务 DRM 与 VFIO/vGPU。',en:'No high-value GPU-specific SR-IOV mechanism changed the route; Nova continues to validate a shared lower control layer for DRM and VFIO/vGPU.'},url:'https://docs.kernel.org/gpu/nova/index.html',i:{zh:'不要把 pci_enable_sriov() 当项目；真正项目是 GPU resource provisioning/reset/isolation，并复用 Control Plane。',en:'Do not treat pci_enable_sriov() as the project; the real work is GPU resource provisioning/reset/isolation using the common control plane.'},p:{zh:'先确认 ASIC 能力',en:'ASIC capability first'}}]},
{id:'power',tab:{zh:'功耗 / 性能',en:'Power / Perf'},name:'GPU Power / Performance',s:{zh:'负责测量、DVFS、runtime PM、thermal 与 power budget。',en:'Own measurement, DVFS, runtime PM, thermal and power budget.'},e:{zh:'busy/idle + utilization accounting → basic DVFS/runtime PM。',en:'busy/idle + utilization accounting → basic DVFS/runtime PM.'},subs:['busy/idle / per-engine utilization','runtime PM / suspend-resume','clock/power gating / residency','DVFS / OPP / FW PM protocol','thermal / power cap','frequency/memory-bandwidth telemetry'],u:[{d:'2026-08-08 · Test #2',t:{zh:'AMD uProf 5.3 继续说明生产 profiling 会复用 GPU hardware events；PM telemetry 应同时服务 DVFS 与 profiling。',en:'AMD uProf 5.3 reinforces that production profiling consumes GPU hardware events; PM telemetry should serve both DVFS and profiling.'},url:'https://docs.amd.com/r/en-US/57368-uProf-user-guide/7.13.1.-GPU-Profiling',i:{zh:'建立可复用 counter/telemetry 层，不要把计数器只绑在 DVFS governor 内。',en:'Build a reusable counter/telemetry layer rather than binding counters only to the DVFS governor.'},p:{zh:'现在设计；PMU 成熟后 6–12 个月',en:'Design now; 6–12 months when PMU is ready'}}]},
{id:'ras',tab:{zh:'可靠性 / RAS',en:'Reliability / RAS'},name:'GPU Reliability / Recovery / RAS',s:{zh:'负责错误检测、诊断、隔离、恢复以及生产级 RAS。',en:'Own fault detection, diagnosis, containment, recovery and production RAS.'},e:{zh:'Hang snapshot + devcoredump + reset reason + heartbeat/watchdog。',en:'Hang snapshot + devcoredump + reset reason + heartbeat/watchdog.'},subs:['heartbeat/watchdog / hang detection','register/ring/context/VM/FW snapshot','devcoredump / reset reason','queue/context/engine/full reset ladder','post-reset restore / replay','ECC / bad-page / AER / fault injection'],u:[{d:'2026-08-08 · Test #2',t:{zh:'Nova task list明确关注 GSP log buffer export，甚至 probe 失败后仍需保留日志。',en:'Nova task list explicitly tracks GSP log-buffer export, including retaining logs after probe failure.'},url:'https://docs.kernel.org/gpu/nova/core/todo.html',i:{zh:'crash snapshot 应纳入 FW log 与 early-boot/probe failure state；Reliability 消费 Firmware owner 提供的标准 health/log channel。',en:'Crash snapshots should include FW logs and early-boot/probe-failure state; Reliability should consume a standard health/log channel from the Firmware owner.'},p:{zh:'现在 / 6–12 个月',en:'Now / 6–12 months'}}]},
{id:'multi',tab:'Multi-GPU',name:'Multi-GPU / P2P / Fabric',s:{zh:'负责 multi-device model、topology/connectivity、P2P 与 fabric；migration policy 仍归 Memory。',en:'Own the multi-device model, topology/connectivity, P2P and fabric; migration policy remains with Memory.'},e:{zh:'enumeration + stable identity + topology + visibility/affinity + P2P capability matrix。',en:'enumeration + stable identity + topology + visibility/affinity + P2P capability matrix.'},subs:['stable GPU identity / BDF/minor mapping','visibility / affinity / namespace','PCIe/NUMA/switch topology','P2P capability / peer BAR/PTE','P2P DMA / dma-buf','shared VM / fabric health'],u:[{d:'2026-08-08 · Test #2',t:{zh:'2026-07-28 的 fabric_ext 把 GPU/DPU/CXL fabric 建模为可编程 movement/ownership/ordering policy 域。',en:'The 2026-07-28 fabric_ext work models GPU/DPU/CXL fabric as a programmable movement/ownership/ordering policy domain.'},url:'https://arxiv.org/abs/2607.26335',i:{zh:'长期 topology/fabric interface 可能需要暴露 movement、ordering、ownership 与 link-health，而不只是 peer-copy capability。',en:'Long-term topology/fabric interfaces may need movement, ordering, ownership and link-health semantics, not just peer-copy capability.'},p:{zh:'长期观察，不产品化',en:'Long-term watch; do not productize now'}},{d:'2026-08-08 · Test #2',t:{zh:'DRM GPU SVM 的 multi-GPU 路线继续支持 topology-first 的当前切入顺序。',en:'DRM GPU SVM multi-GPU work continues to support a topology-first sequence.'},url:'https://www.kernel.org/doc/html/latest/gpu/rfc/gpusvm.html',i:{zh:'先做 identity/topology/P2P matrix，shared VM 和 multi-GPU UVM 后置。',en:'Build identity/topology/P2P matrix first; shared VM and multi-GPU UVM later.'},p:{zh:'现在',en:'Now'}}]},
{id:'obs',tab:{zh:'可观测性 / Profiling',en:'Observability / Profiling'},name:'GPU Observability / Profiling / Programmable Driver',s:{zh:'负责 software trace、hardware PMU、跨层关联与 programmable diagnostics。',en:'Own software tracing, hardware PMU, cross-layer correlation and programmable diagnostics.'},e:{zh:'eBPF KMD dynamic tracing；HW PMU 成熟后加入 per-process/context profiling。',en:'eBPF KMD dynamic tracing; add per-process/context profiling when HW PMU is mature.'},subs:['stable tracepoint/event model','BTF/CO-RE / eBPF','PID/PASID/VM/context/queue/job correlation','KMD/FW/UMD unified timeline','GPU PMU / perf integration','dynamic diagnostics / future verified policy'],u:[{d:'2026-08-08 · Test #2',t:{zh:'ProfInfer 展示 eBPF runtime trace 与 hardware-counter trend 统一关联的低侵入 profiling 路径。',en:'ProfInfer demonstrates low-intrusion profiling that correlates eBPF runtime traces with hardware-counter trends.'},url:'https://arxiv.org/abs/2601.20755',i:{zh:'不要维护两套独立“debug trace”和“performance profile”对象模型；统一 timestamp/object identity。',en:'Avoid separate debug-trace and performance-profile object models; unify timestamp/object identity.'},p:{zh:'trace 现在；统一 PMU timeline 6–12 个月',en:'Trace now; unified PMU timeline in 6–12 months'}},{d:'2026-08-08 · Test #2',t:{zh:'gpu_ext/fabric_ext 继续强化 verified programmable policy 的研究信号，但尚不应产品化。',en:'gpu_ext/fabric_ext strengthen the verified programmable-policy research signal, but are not ready for productization.'},url:'https://arxiv.org/abs/2512.12615',i:{zh:'现在只投资稳定 hooks、object correlation、telemetry；policy hooks 长期观察。',en:'Invest now in stable hooks, object correlation and telemetry; keep policy hooks as long-term research.'},p:{zh:'长期 policy watch',en:'Long-term policy watch'}}]},
{id:'fw',tab:'Firmware / Control Plane',name:'GPU Firmware / Control Plane Architecture',s:{zh:'负责 KMD↔GPU system firmware 的协议、生命周期、capability 与 ownership 架构。',en:'Own the KMD↔GPU system-firmware protocol, lifecycle, capability and ownership architecture.'},e:{zh:'Versioned async protocol + capability negotiation + restart generation/state reconciliation。',en:'Versioned async protocol + capability negotiation + restart generation/state reconciliation.'},subs:['versioned ABI / command-event namespace','async completion / timeout / error','capability negotiation / compatibility','boot/restart/upgrade lifecycle','resource ownership / state reconciliation','PM/reset/HW-scheduler services','FW health/log/authentication'],u:[{d:'2026-08-08 · Test #2',t:{zh:'Nova 明确把 GSP-RM API 跨版本不稳定视为核心架构问题。',en:'Nova explicitly treats GSP-RM API instability across firmware versions as a core architecture problem.'},url:'https://docs.kernel.org/gpu/nova/core/todo.html',i:{zh:'集中 version translation/capability negotiation，禁止 feature 内散落 fw_version 判断；同时把 FW log/health 纳入正式 service。',en:'Centralize version translation/capability negotiation, avoid scattered fw_version checks, and make FW log/health a formal service.'},p:{zh:'现在',en:'Now'}},{d:'2026-08-08 · Test #2',t:{zh:'nova-core 继续验证 lower control layer 同时服务 DRM 与 VFIO/vGPU 的模式。',en:'nova-core continues to validate a lower control layer shared by DRM and VFIO/vGPU.'},url:'https://docs.kernel.org/gpu/nova/index.html',i:{zh:'resource ownership/FW lifecycle 应位于 client/uAPI 之下。',en:'Resource ownership and FW lifecycle should live below client/uAPI layers.'},p:{zh:'现在做架构',en:'Architecture now'}}]}
];
const F={s:{zh:'公共 Topic 不分配 Owner，只追踪未来 1–3 年可能改变 KMD 架构的 Linux GPU/accelerator upstream 机制。',en:'The shared topic is not assigned to an owner; it tracks Linux GPU/accelerator upstream mechanisms that may change KMD architecture in 1–3 years.'},subs:['DRM GPU SVM / drm_pagemap','DRM/Accel common infrastructure','firmware-centric / hardware-scheduler architecture','Rust GPU driver abstractions','MM/IOMMU/PCIe/CXL/eBPF mechanisms','uAPI/ABI/upstream policy'],u:[{d:'2026-08-08 · Test #2',t:{zh:'当前最强信号仍是 GPU SVM commonization、Nova firmware-centric layering，以及 GPU/CXL programmable-fabric research。',en:'The strongest signals remain GPU SVM commonization, Nova firmware-centric layering and programmable GPU/CXL-fabric research.'},url:'https://www.kernel.org/doc/html/latest/gpu/rfc/gpusvm.html',i:{zh:'前两项值得现在做架构兼容；programmable fabric/eBPF policy 只长期观察。',en:'Design for compatibility with the first two now; keep programmable fabric/eBPF policy as long-term research.'},p:{zh:'分层处理',en:'Tiered follow-up'}}]};
let lang=localStorage.getItem('site-lang')||'zh',active=location.hash.slice(1)||'home';const t=x=>typeof x==='string'?x:x[lang];
function cardOwner(o){return `<section class="pane ${active===o.id?'active':''}" id="${o.id}"><div class="card"><div class="section-title"><h2>${o.name}</h2><span class="badge stable">${U[lang].stable}</span></div><p>${t(o.s)}</p></div><div class="card"><div class="section-title"><h3>${U[lang].sub}</h3><span class="badge living">${U[lang].living}</span></div><ul>${o.subs.map(x=>`<li>${x}</li>`).join('')}</ul><p class="entry"><strong>${U[lang].entry}:</strong> ${t(o.e)}</p></div><div class="card"><div class="section-title"><h3>${U[lang].industry}</h3><span class="badge living">Test #2</span></div>${o.u.map(x=>`<div class="industry-item"><h4>${x.d} — ${t(x.t)}</h4><p><a href="${x.url}" target="_blank" rel="noopener">Source ↗</a></p><p><strong>${U[lang].impact}:</strong> ${t(x.i)}</p><p><strong>${U[lang].priority}:</strong> ${t(x.p)}</p></div>`).join('')}</div></section>`}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.getElementById('back').textContent=U[lang].back;document.getElementById('langToggle').textContent=U[lang].toggle;document.getElementById('subtitle').textContent=U[lang].subtitle;document.getElementById('footer').textContent=U[lang].footer;document.getElementById('tabs').innerHTML=`<button class="tab ${active==='home'?'active':''}" data-id="home">${U[lang].home}</button>${O.map(o=>`<button class="tab ${active===o.id?'active':''}" data-id="${o.id}">${t(o.tab)}</button>`).join('')}<button class="tab ${active==='future'?'active':''}" data-id="future">${U[lang].future}</button>`;const rows=O.map(o=>`<tr><td>${o.name}</td><td>${t(o.e)}</td></tr>`).join('');const home=`<section class="pane ${active==='home'?'active':''}" id="home"><div class="card"><div class="section-title"><h2>${lang==='zh'?'七个一级 Owner':'Seven top-level owners'}</h2><span class="badge stable">${U[lang].stable}</span></div><p>${lang==='zh'?'本轮没有新增第 8 个 Owner；七个方向保持稳定。':'No eighth owner is added in this run; the seven-owner taxonomy remains stable.'}</p><table><tr><th>Owner</th><th>${U[lang].entry}</th></tr>${rows}</table></div><div class="card"><h3>${lang==='zh'?'本轮重点':'Run focus'}</h3><p>${lang==='zh'?'Memory 将 migration granularity 提升为第二阶段 feature；Multi-GPU/Observability 加入 fabric_ext / ProfInfer 等最新信号；Virtualization 明确无高价值新机制，不用旧闻凑数。':'Memory promotes migration granularity to a second-stage feature; Multi-GPU/Observability add fabric_ext / ProfInfer signals; Virtualization explicitly records no high-value new mechanism instead of padding with old news.'}</p></div></section>`;const future=`<section class="pane ${active==='future'?'active':''}" id="future"><div class="card"><h2>${U[lang].future}</h2><p>${t(F.s)}</p><ul>${F.subs.map(x=>`<li>${x}</li>`).join('')}</ul>${F.u.map(x=>`<div class="industry-item"><h4>${x.d} — ${t(x.t)}</h4><p><a href="${x.url}" target="_blank" rel="noopener">Source ↗</a></p><p><strong>${U[lang].impact}:</strong> ${t(x.i)}</p><p><strong>${U[lang].priority}:</strong> ${t(x.p)}</p></div>`).join('')}</div></section>`;document.getElementById('content').innerHTML=home+O.map(cardOwner).join('')+future;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.id;history.replaceState(null,'','#'+active);render()})}
document.getElementById('langToggle').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('site-lang',lang);render()};render();
</script></body></html>
