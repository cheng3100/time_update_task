<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU KMD Owner Direction</title><link rel="stylesheet" href="../assets/site.css"></head><body><main class="shell"><div class="topbar"><a href="../" id="back"></a><div><a href="./raw-updates.html" id="raw"></a> · <a href="./memory-roadmap.html" id="mem"></a> · <a href="./resources.html" id="res"></a> &nbsp; <button class="lang-toggle" id="toggle"></button></div></div><header class="hero"><h1>GPU KMD Owner Direction</h1><p class="muted" id="subtitle"></p></header><div class="tabs" id="tabs"></div><div id="content"></div><div class="foot" id="foot"></div></main><script>const O={memory:{n:'GPU Memory / Virtual Memory / Unified Memory',tz:'Memory',te:'Memory',sz:'负责从 GPUVM、Linux MM 集成到 unified/heterogeneous memory 的完整内存架构，是 KMD Leader 的纵深主线。',se:'Own the full memory architecture from GPUVM and Linux MM integration to unified/heterogeneous memory; the KMD leader depth line.',ez:'Recoverable fault + HMM + migration + replay；第二阶段进入 migration granularity。',ee:'Recoverable fault + HMM + migration + replay; stage two moves into migration granularity.',topics:[['gpuvm','GPUVM / Page Tables / VMID / PASID / TLB'],['fault-replay','Recoverable GPU Page Fault / Fault Replay'],['hmm-svm','mmu_notifier / HMM / SVM / Device-private Memory'],['migration','CPU↔GPU Migration / Oversubscription / Eviction'],['large-pages','NUMA / Large & Compound Pages / Migration Granularity'],['iommu-sva','IOMMU / ATS / PRI / PASID / SVA'],['dmabuf-p2p','dma-buf / P2P Memory'],['multigpu-uvm','Multi-GPU Unified Memory']],u:[['GPU SVM / drm_pagemap 继续成为 shared-memory 公共层核心信号','GPU SVM / drm_pagemap remains the core common-layer signal','https://docs.kernel.org/gpu/rfc/gpusvm.html','保持 Linux-MM-facing SVM 与 HW-specific GPUVM/fault 分层；mixed residency、multi-GPU、compound pages、higher-order DMA 都应可演进。','Keep Linux-MM-facing SVM separate from HW-specific GPUVM/fault mechanisms; mixed residency, multi-GPU, compound pages and higher-order DMA should remain evolvable.','现在','Now'],['N:1 per-device state 对 multi-GPU 数据模型很关键','N:1 per-device state is important for multi-GPU data models','https://docs.kernel.org/next/gpu/rfc/gpusvm.html','不要把 CPU range identity、device residency、DMA mapping、GPU PTE state 合成一个对象。','Do not conflate CPU range identity, device residency, DMA mapping and GPU PTE state.','架构兼容现在','Design compatibility now']]},virt:{n:'GPU Virtualization / Security',tz:'虚拟化 / 安全',te:'Virt / Security',sz:'负责 GPU 虚拟化、资源/租户隔离以及安全机制。',se:'Own GPU virtualization, resource/tenant isolation and security mechanisms.',ez:'ASIC 支持 SR-IOV 时做 PF/VF provisioning/isolation；否则先 capability assessment。',ee:'When SR-IOV exists on the ASIC, do PF/VF provisioning/isolation; otherwise start with capability assessment.',topics:[['vfio','VFIO Passthrough / Ownership / IOMMU Isolation'],['sriov','SR-IOV PF/VF Lifecycle'],['resource-partition','GPU Resource Partition / VMID / Queue / Doorbell / Memory'],['pfvf-reset','PF↔VF ABI / VF FLR / Reset / Accounting'],['vgpu-live','vGPU / Live Migration Groundwork'],['security','Secure Boot / Measurement / Scrub / Attestation']],u:[['Xe configfs 明确 SR-IOV max_vfs / PF mode 的 probe 前配置模型','Xe configfs documents pre-probe SR-IOV max_vfs / PF-mode configuration','https://docs.kernel.org/gpu/xe/xe_configfs.html','GPU SR-IOV 不只是 pci_enable_sriov()；PF mode、VF 数量、resource lifecycle 与 probe/bind 必须一起设计。','GPU SR-IOV is more than pci_enable_sriov(); PF mode, VF count, resource lifecycle and probe/bind must be designed together.','ASIC 支持时参考','Reference when supported'],['Nova 继续验证共享 lower control layer 服务 DRM 与 VFIO/vGPU','Nova continues to validate a shared lower control layer for DRM and VFIO/vGPU','https://docs.kernel.org/gpu/nova/index.html','虚拟化应消费通用 resource/control service，而不是复制第二套 FW/reset 路径。','Virtualization should consume common resource/control services rather than duplicate FW/reset paths.','6–12 个月','6–12 months']]},power:{n:'GPU Power / Performance',tz:'功耗 / 性能',te:'Power / Perf',sz:'负责 GPU measurement、DVFS、runtime PM、thermal 与 power budget。',se:'Own GPU measurement, DVFS, runtime PM, thermal and power budget.',ez:'busy/idle + reusable utilization telemetry → DVFS → runtime PM。',ee:'busy/idle + reusable utilization telemetry → DVFS → runtime PM.',topics:[['utilization','Busy/Idle / Per-engine Utilization'],['runtime-pm','Runtime PM / Suspend-Resume / PCI D-states'],['clock-gating','Clock / Power Gating / Idle Residency'],['dvfs','DVFS / OPP / Firmware PM Protocol'],['thermal','Thermal Throttling / Power Cap'],['telemetry','Frequency Residency / Memory-bandwidth Telemetry']],u:[['本期无新的方向级变化','No new direction-level change this run','https://docs.kernel.org/gpu/xe/xe_pm.html','继续 measurement/lifetime/constraint layer 优先；telemetry 同时供 DVFS 与 Profiling 使用。','Keep measurement/lifetime/constraint layers first; telemetry should serve both DVFS and profiling.','现在','Now']]},ras:{n:'GPU Reliability / Recovery / RAS',tz:'可靠性 / RAS',te:'Reliability / RAS',sz:'负责故障 detect → diagnose → contain → recover，并形成生产级 RAS。',se:'Own fault detect → diagnose → contain → recover, ultimately forming production-grade RAS.',ez:'Hang snapshot + devcoredump + FW log + reset reason + heartbeat/watchdog。',ee:'Hang snapshot + devcoredump + FW logs + reset reason + heartbeat/watchdog.',topics:[['heartbeat','Heartbeat / Watchdog / Hang Detection'],['snapshot','Hang Snapshot / devcoredump / Reset Reason'],['recovery','Job Abort / Queue Kill / Context Kill / Engine Reset'],['restore','Post-reset Restore / Replay'],['fw-crash','Firmware Crash Recovery / FW Log Retention'],['ecc-aer','ECC / Bad-page Retirement / PCIe AER / Fault Injection']],u:[['snapshot-before-reset 仍是硬约束','snapshot-before-reset remains the hard invariant','https://docs.kernel.org/gpu/xe/xe_devcoredump.html','恢复动作前冻结证据；FW log 与 early probe/boot failure 应进入统一 crash object。','Freeze evidence before recovery; include FW logs and early probe/boot failures in the same crash object.','现在','Now'],['Nova 继续把 GSP log export 作为明确任务','Nova continues to track GSP log export as an explicit task','https://docs.kernel.org/gpu/nova/core/todo.html','FW 日志应成为 RAS 可消费的稳定 Control Plane service。','FW logs should be a stable Control Plane service consumable by RAS.','6–12 个月','6–12 months']]},multi:{n:'Multi-GPU / P2P / Fabric',tz:'Multi-GPU',te:'Multi-GPU',sz:'负责 multi-device model、topology/connectivity、P2P 与 fabric；page residency/migration policy 归 Memory。',se:'Own the multi-device model, topology/connectivity, P2P and fabric; page residency/migration policy belongs to Memory.',ez:'Enumeration + stable identity + topology + visibility/affinity + P2P capability matrix。',ee:'Enumeration + stable identity + topology + visibility/affinity + P2P capability matrix.',topics:[['identity','Multi-GPU Enumeration / Stable Identity'],['visibility','Device Visibility / Affinity / Namespace / Cgroup'],['topology','PCIe / NUMA / Switch Topology'],['p2p','P2P Capability / Peer BAR / Peer PTE'],['p2p-dma','P2P DMA / Cross-GPU dma-buf'],['shared-vm','Shared VA / Multi-GPU VM / Fabric Health']],u:[['GPU SVM N:1 per-device state 支持 topology-first 设计','GPU SVM N:1 per-device state supports a topology-first design','https://docs.kernel.org/next/gpu/rfc/gpusvm.html','CPU VA identity 与每个 GPU residency/mapping 分离；先 topology/P2P，再 shared VM。','Separate CPU VA identity from each GPU residency/mapping; topology/P2P before shared VM.','现在','Now'],['fabric_ext 仍是高价值长期研究信号','fabric_ext remains a high-value long-term research signal','https://arxiv.org/abs/2607.26335','长期 fabric interface 可能需要 movement、ordering、ownership、link health，而不只是 peer-copy。','Long-term fabric interfaces may need movement, ordering, ownership and link-health semantics, not just peer-copy.','长期观察','Long-term watch']]},obs:{n:'GPU Observability / Profiling / Programmable Driver Infrastructure',tz:'可观测性 / Profiling',te:'Observability / Profiling',sz:'负责 software trace + hardware PMU + 跨层 timeline/attribution + programmable diagnostics。',se:'Own software trace + hardware PMU + cross-layer timeline/attribution + programmable diagnostics.',ez:'Stable event/object identity + eBPF KMD tracing；HW PMU 成熟后加入同一 timeline。',ee:'Stable event/object identity + eBPF KMD tracing; join HW PMU into the same timeline when mature.',topics:[['tracepoints','Stable KMD Tracepoint / Event Model'],['ebpf','BTF / CO-RE / eBPF Dynamic Tracing'],['correlation','PID / PASID / VM / Context / Queue / Job Correlation'],['timeline','UMD→KMD→FW→GPU Unified Timeline'],['pmu','GPU PMU / Counter Discovery / Sampling / Multiplexing'],['perf-policy','perf_event / Dynamic Diagnostics / Programmable Hooks']],u:[['统一 trace + PMU 数据模型仍是主线','A unified trace + PMU data model remains the main line','https://arxiv.org/abs/2601.20755','先统一 timestamp/object identity，再接 PMU 与 crash snapshot。','Unify timestamp/object identity first, then join PMU and crash snapshots.','Trace 现在；PMU 6–12 个月','Trace now; PMU 6–12 months'],['gpu_ext / fabric_ext 支持“stable hooks 现在、policy 长期”','gpu_ext / fabric_ext support “stable hooks now, policy later”','https://arxiv.org/abs/2512.12615','投资 stable hooks/correlation/telemetry，不急于产品化 programmable policy。','Invest in stable hooks/correlation/telemetry without productizing programmable policy yet.','长期观察','Long-term watch']]},fw:{n:'GPU Firmware / Control Plane Architecture',tz:'Firmware / Control Plane',te:'Firmware / Control Plane',sz:'负责 KMD↔GPU system firmware 的 protocol、lifecycle、capability、resource ownership 与 state reconciliation。',se:'Own KMD↔GPU system-firmware protocol, lifecycle, capability, resource ownership and state reconciliation.',ez:'Versioned async protocol + capability negotiation + restart generation/state reconciliation。',ee:'Versioned async protocol + capability negotiation + restart generation/state reconciliation.',topics:[['abi','Versioned Firmware ABI / Command & Event Namespace'],['transport','Shared-memory / Ring / Mailbox Transport'],['async','Sequence ID / Async Completion / Timeout / Error'],['capability','Capability Negotiation / Forward-Backward Compatibility'],['lifecycle','Boot / Restart / Upgrade / Rollback Lifecycle'],['ownership','Resource Ownership / State Reconciliation'],['services','FW-centric Init / PM / Reset / HW Scheduler Services'],['health-security','FW Health / Logs / Authentication / Measurement']],u:[['Nova guidelines 把 firmware-version-independent API 明确成架构规则','Nova guidelines make firmware-version-independent APIs an explicit architecture rule','https://docs.kernel.org/next/gpu/nova/core/guidelines.html','二级 driver 不应看到 FW-version-specific 结构/语义；version translation/capability 应位于稳定 service API 以下。','Second-level drivers should not see FW-version-specific structures/semantics; keep version translation/capability below stable service APIs.','现在','Now'],['GSP API instability + probe-failure log export 仍是明确任务','GSP API instability + probe-failure log export remain explicit tasks','https://docs.kernel.org/gpu/nova/core/todo.html','Control Plane 应同时提供 version abstraction 与 FW health/log service。','The Control Plane should provide both version abstraction and an FW health/log service.','协议现在；health/log 下一阶段','Protocol now; health/log next']]}};let lang=localStorage.getItem('site-lang')||'zh',active=location.hash.slice(1)||'home';const U={zh:{back:'← 所有任务',raw:'原始更新归档',mem:'Memory 详细路线',res:'长期资料库',toggle:'English',subtitle:'稳定 Owner 定义 + 一级 Owner 业界动态 + 子方向独立长期学习页。当前展示：2026-08-08 Test #3 · Resource Model R2。',stable:'稳定 Summary',living:'持续更新',entry:'当前切入',industry:'本期业界最新动态',learn:'子方向长期学习页',impact:'KMD 影响',priority:'优先级',home:'首页',future:'公共未来 Topic',foot:'Stable Summary 只在明确方向决策时修改；Industry Updates 按 Owner 每期刷新；每个子方向独立文档/页面稳定增长。'},en:{back:'← All tasks',raw:'Raw Update Archive',mem:'Memory Detailed Roadmap',res:'Learning Resources',toggle:'中文',subtitle:'Stable owner definitions + Owner-level industry updates + independent durable learning pages per sub-direction. Current view: 2026-08-08 Test #3 · Resource Model R2.',stable:'Stable summary',living:'Living',entry:'Current entry',industry:'Industry Updates — This Run',learn:'Sub-direction learning page',impact:'KMD impact',priority:'Priority',home:'Home',future:'Future Kernel Topic',foot:'Stable summaries change only on explicit direction decisions. Industry Updates refresh per Owner; every sub-direction has an independently maintained learning document/page.'}};function t(z,e){return lang==='zh'?z:e}function owner(k){const o=O[k];return `<section class="pane active"><div class="card"><div class="section-title"><h2>${o.n}</h2><span class="badge stable">${U[lang].stable}</span></div><p>${t(o.sz,o.se)}</p></div><div class="card"><div class="section-title"><h3>${U[lang].living}</h3><span class="badge living">Living</span></div><ul>${o.topics.map(x=>`<li>${x[1]}<br><span class="muted">${U[lang].learn}: <a href="./topic.html?topic=${k}%2F${x[0]}">${lang==='zh'?'打开独立资料页':'Open dedicated learning page'}</a></span></li>`).join('')}</ul><p class="entry"><strong>${U[lang].entry}:</strong> ${t(o.ez,o.ee)}</p></div><div class="card"><div class="section-title"><h3>${U[lang].industry}</h3><span class="badge living">Test #3 R2</span></div>${o.u.map(x=>`<p><strong><a target="_blank" rel="noopener" href="${x[2]}">${t(x[0],x[1])}</a></strong><br>${U[lang].impact}: ${t(x[3],x[4])}<br><span class="muted">${U[lang].priority}: ${t(x[5],x[6])}</span></p>`).join('')}</div></section>`}function home(){return `<section class="pane active"><div class="card"><h2>${lang==='zh'?'Owner 大方向':'Owner Map'}</h2><table><tr><th>Owner</th><th>${U[lang].entry}</th></tr>${Object.values(O).map(o=>`<tr><td>${o.n}</td><td>${t(o.ez,o.ee)}</td></tr>`).join('')}</table></div><div class="card"><h2>${lang==='zh'?'本期知识结构':'Knowledge structure this run'}</h2><p>${lang==='zh'?'业界动态仍按一级 Owner 维护；长期学习资料改为每个子方向一个独立 Markdown 文档 + 唯一 Pages URL，资源条目固定说明“是什么 / 价值点 / 学习重点 / 学习注意”。':'Industry updates remain grouped by top-level Owner. Durable learning resources now use one independent Markdown document and unique Pages URL per sub-direction, with fixed annotations: what it is / why it matters / what to study / study notes.'}</p></div></section>`}function future(){return `<section class="pane active"><div class="card"><h2>${U[lang].future}</h2><p>${lang==='zh'?'继续跟踪 GPU SVM/drm_pagemap、Nova firmware-centric layering、Xe SR-IOV lifecycle、gpu_ext/fabric_ext；本期不新增第 8 个 Owner。':'Continue tracking GPU SVM/drm_pagemap, Nova firmware-centric layering, Xe SR-IOV lifecycle and gpu_ext/fabric_ext; no eighth Owner is added this run.'}</p></div></section>`}function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';back.textContent=U[lang].back;raw.textContent=U[lang].raw;mem.textContent=U[lang].mem;res.textContent=U[lang].res;toggle.textContent=U[lang].toggle;subtitle.textContent=U[lang].subtitle;tabs.innerHTML=`<button class="tab ${active==='home'?'active':''}" data-k="home">${U[lang].home}</button>`+Object.entries(O).map(([k,o])=>`<button class="tab ${active===k?'active':''}" data-k="${k}">${t(o.tz,o.te)}</button>`).join('')+`<button class="tab ${active==='future'?'active':''}" data-k="future">${U[lang].future}</button>`;content.innerHTML=active==='home'?home():active==='future'?future():owner(active);foot.textContent=U[lang].foot;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.k;history.replaceState(null,'','#'+active);render()});localStorage.setItem('site-lang',lang)}toggle.onclick=()=>{lang=lang==='zh'?'en':'zh';render()};render();</script></body></html>
