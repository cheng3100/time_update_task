t.getElementById('langToggle');let lang=localStorage.getItem('site-lang')||'zh';function setLang(next){lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-zh][data-en]').forEach(el=>el.textContent=el.dataset[lang]);toggle.textContent=lang==='zh'?'English':'中文';localStorage.setItem('site-lang',lang)}toggle.addEventListener('click',()=>setLang(lang==='zh'?'en':'zh'));setLang(lang);</script></body></html>
