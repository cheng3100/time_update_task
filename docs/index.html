<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Update Tasks</title><link rel="stylesheet" href="./assets/site.css"></head><body><main class="shell"><div class="topbar"><span></span><button class="lang-toggle" id="langToggle" type="button">English</button></div><header class="hero"><h1 data-zh="定时更新任务" data-en="Time Update Tasks">定时更新任务</h1><p class="muted" data-zh="所有定时更新任务的长期归档与 GitHub Pages 入口。" data-en="Long-term archive and GitHub Pages index for scheduled update tasks.">所有定时更新任务的长期归档与 GitHub Pages 入口。</p></header><div class="grid"><a class="task" href="./kmd_owner_direction/"><strong data-zh="GPU KMD Owner 方向" data-en="GPU KMD Owner Direction">GPU KMD Owner 方向</strong><br><span class="muted" data-zh="稳定的 Owner 划分、持续演进的切入 Feature 与业界最新动态。" data-en="Stable owner taxonomy, living entry features and latest industry updates.">稳定的 Owner 划分、持续演进的切入 Feature 与业界最新动态。</span></a></div><div class="foot" data-zh="每个定时任务使用独立子目录和独立页面。" data-en="Each scheduled task owns one subdirectory and one independent page.">每个定时任务使用独立子目录和独立页面。</div></main><script>const toggle=document.getElementById('langToggle');let lang=localStorage.getItem('site-lang')||'zh';function setLang(next){lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-zh][data-en]').forEach(el=>el.textContent=el.dataset[lang]);toggle.textContent=lang==='zh'?'English':'中文';localStorage.setItem('site-lang',lang)}toggle.addEventListener('click',()=>setLang(lang==='zh'?'en':'zh'));setLang(lang);</script></body></html>
