title: Time Update Tasks
description: Long-term pages for scheduled technical update tasks.
remote_theme: just-the-docs/just-the-docs@v0.12.0
baseurl: /time_update_task
url: https://cheng3100.github.io
markdown: kramdown
encoding: utf-8
color_scheme: hack
search_enabled: true
nav_enabled: true
nav_sort: case_insensitive
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  "GitHub Repository":
    - "https://github.com/cheng3100/time_update_task"
aux_links_new_tab: true

exclude:
  - kmd_owner_direction/README.md
  - kmd_owner_direction/UPDATE_RULES.md
  - kmd_owner_direction/sample
  - README.md
  - vendor

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
