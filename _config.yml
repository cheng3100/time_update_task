title: Time Update Tasks
description: Long-term archive and living pages for scheduled technical update tasks.
theme: jekyll-theme-architect
baseurl: /time_update_task
url: https://cheng3100.github.io
markdown: kramdown
encoding: utf-8

# Jekyll pages and archive Markdown are separated by semantic filenames.
# Owner archive files use *.archive.md, so they can coexist with generated
# /kmd_owner_direction/owners/*.html pages without output-path collisions.
# Other archive families remain explicitly excluded until their historical
# files are migrated to *.resource.md / *.raw.md / *.update.md.
exclude:
  - docs
  - kmd_owner_direction/HOME.md
  - kmd_owner_direction/README.md
  - kmd_owner_direction/archive_audit_2026-08-08.md
  - kmd_owner_direction/resources
  - kmd_owner_direction/raw_updates
  - kmd_owner_direction/updates
  - kmd_owner_direction/public_future_topic.md
  - README.md
  - UPDATE_RULES.md
  - vendor

collections:
  pages:
    output: true

plugins:
  - jekyll-seo-tag
